<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>级联门户同步记录</title>
<style>
:root{--blue:#2159fc;--ink:#263345;--muted:#667284;--edge:#e2e6ed;--head:#f7f7fb;--stripe:#eef3f7;--tabs:#edf0fa;--shadow:0 12px 36px #17294b26}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:13px/1.5 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.topbar{height:51px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 20px 0 16px;border-bottom:1px solid #e2e5eb}
.brand,.topright,.switcher{display:flex;align-items:center;gap:10px}
.apps{width:18px;height:18px;background:repeating-linear-gradient(90deg,transparent 0 4px,#fff 4px 6px),repeating-linear-gradient(0deg,#2159fc 0 4px,#fff 4px 6px);flex:none}
.topright{gap:14px;color:#5c6879}
.prototype{font-size:12px;color:#697588}
.avatar{background:#edf2ff;color:#285cf0;border-radius:50%;display:grid;place-items:center;font-weight:700;width:27px;height:27px;flex:none}
.switcher select{min-width:128px;height:30px}
.tabs{height:39px;display:flex;align-items:flex-end;gap:5px;padding:5px 4px 0;background:#fafbfd;box-shadow:0 2px 5px #2036550d}
.tab{height:31px;min-width:156px;padding:5px 15px;text-align:center;background:var(--tabs);color:#475267;border:1px solid #ebedf4;border-bottom:0;border-radius:4px 4px 0 0;font-size:12px;white-space:nowrap}
.tab.active{background:#fff;color:var(--blue);border-color:#e7eaf1;font-weight:650}
main{padding:22px 20px 13px;max-width:2400px;margin:0 auto;height:calc(100dvh - 90px);display:flex;flex-direction:column}
.filters{display:flex;flex-wrap:wrap;align-items:end;column-gap:10px;row-gap:12px;margin:0 0 22px;flex:none}
.field{display:grid;gap:4px;min-width:0;flex:1 1 113px}
.field label,.filter-date legend{color:#4b5666;font-size:12px}
.select,input[type=date],.jump input{width:100%;height:33px;color:#344052;background:#fff;border:1px solid #dce0e7;border-radius:3px;padding:0 10px}
.select{appearance:none;padding-right:25px;background:linear-gradient(45deg,transparent 49%,#828d9c 50%,#828d9c 60%,transparent 61%) right 13px center/5px 6px no-repeat,linear-gradient(135deg,transparent 39%,#828d9c 40%,#828d9c 50%,transparent 51%) right 8px center/5px 6px no-repeat #fff}
.select:invalid{color:#8c96a3}
.filter-date{border:0;margin:0;padding:0;flex:1 1 236px;min-width:226px}
.filter-date legend{padding:0 0 4px}
.daterange{display:flex;align-items:center;height:33px;border:1px solid #dce0e7;border-radius:3px;background:#fff}
.daterange input{border:0;min-width:0;height:30px;padding:0 5px 0 8px;font-variant-numeric:tabular-nums;color:#445064}
.daterange span{color:#758094;flex:none;margin:0 3px}
.actions{display:flex;gap:9px;margin-left:auto}
.btn{height:32px;border:1px solid #dce0e7;border-radius:4px;background:#fff;color:#414b59;padding:0 15px;white-space:nowrap;font-size:12px}
.btn:not(:disabled):hover{border-color:#a8beff;color:var(--blue);background:#f4f7ff}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.primary:not(:disabled):hover{background:#4673ff;border-color:#4673ff;color:#fff}
.link{padding:2px 0;border:0;background:none;color:var(--blue);white-space:nowrap;font-size:12px;line-height:1.5}
.link:not(:disabled):hover{text-decoration:underline}
.tableframe{border:1px solid var(--edge);overflow:auto;flex:1 1 auto;min-height:130px}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.record-table{min-width:880px;table-layout:fixed}
th,td{text-align:left;border-bottom:1px solid #e7eaf0;vertical-align:middle}
.record-table th,.record-table td{height:43px;padding:0 13px;border-right:1px solid #e7eaf0}
.record-table th:last-child,.record-table td:last-child{border-right:0}
th{background:var(--head);color:#344154;font-weight:650}
.record-table th{height:44px;position:sticky;top:0;z-index:1}
.record-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#445064}
tbody tr:nth-child(even){background:var(--stripe)}
tbody tr:hover{background:#eaf0ff}
tbody tr:last-child td{border-bottom:0}
.row-actions{display:flex;gap:15px;align-items:center}
.state{display:inline-flex;align-items:center;white-space:nowrap;gap:7px;font-size:12px;line-height:20px}
.state::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.state.success,.chain-hop.success{color:#208653}.state.fail,.chain-hop.fail{color:#cc453b}.state.partial{color:#a96211}.state.running,.chain-hop.running{color:#2159fc}.state.pending,.chain-hop.pending{color:#697687}.state.covered,.chain-hop.covered{color:#6e7786}
.state.running::before{animation:pulse 1.25s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 3px #2159fc27}}
.empty{text-align:center!important;height:126px!important;color:#7b8694!important}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;flex:none;font-size:12px;color:#465263}
.pager-left,.pager-right,.pagebuttons,.jump{display:flex;align-items:center;gap:8px}
.pager select{width:105px;height:31px}
.page{min-width:28px;height:28px;padding:0 4px;border:0;background:transparent;border-radius:3px;color:#3f4d5d}
.page:hover:not(:disabled),.page[aria-current=page]{color:var(--blue);background:#f0f4ff;font-weight:700}
.jump{margin-left:12px}
.jump input{width:52px;text-align:center;height:28px;padding:0}
dialog{width:min(1080px,calc(100vw - 38px));max-height:calc(100dvh - 56px);padding:0;border:1px solid #e1e6ed;border-radius:5px;color:var(--ink);box-shadow:var(--shadow);background:#fff}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:#16243b63}
#retry-dialog{width:min(920px,calc(100vw - 36px))}
#segment-dialog{width:min(850px,calc(100vw - 36px))}
.dialog-route{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:9px 11px;margin:0 0 12px;background:#f1f4fa;color:#465367}
.route-arrow{color:#8390a1;padding:0 6px}
.detail-tabs{display:flex;gap:14px;border-bottom:1px solid var(--edge);margin-bottom:12px}
.detail-tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:#536176;padding:7px 4px}
.detail-tabs button[aria-pressed=true]{color:var(--blue);border-color:var(--blue);font-weight:650}
.paged-table{border:1px solid var(--edge);overflow:auto;max-height:min(400px,48dvh)}
.paged-table th{position:sticky;top:0;z-index:1}
.paged-table .subtable{min-width:470px}
.object-pager{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;color:#536176;font-size:12px}
.object-pager div{display:flex;align-items:center;gap:8px}
.portal-popover{position:fixed;z-index:4;min-width:126px;max-width:min(290px,calc(100vw - 20px));max-height:min(225px,50dvh);overflow:auto;margin:0;padding:5px 0;border:1px solid var(--edge);border-radius:4px;box-shadow:0 5px 16px #17294b22;background:#fff;color:var(--ink);font-size:12px;list-style:none}
.portal-popover li{padding:5px 11px;overflow-wrap:anywhere}
.dialog-header{display:flex;align-items:center;justify-content:space-between;padding:14px 21px;border-bottom:1px solid var(--edge);flex:none}
.dialog-header h2{margin:0;font-size:16px;font-weight:650;color:#27364a}
.icon-close{background:none;border:0;padding:0 2px;color:#687487;font-size:22px;line-height:24px}
.dialog-body{padding:17px 21px 20px;overflow:auto;min-height:0;overscroll-behavior:contain}
.dialog-foot{padding:11px 21px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--edge);background:#fff;flex:none}
.section-title{font-size:13px;font-weight:700;margin:0 0 10px;color:#334156}
.section-title.spaced{margin-top:17px}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--edge);border-left:1px solid var(--edge);margin:0}
.summary div{display:flex;align-items:stretch;min-width:0;min-height:38px;border-bottom:1px solid var(--edge);border-right:1px solid var(--edge)}
.summary dt{background:#f7f8fc;padding:8px 10px;min-width:90px;flex:none;color:#4d5a6d}
.summary dd{margin:0;padding:8px 10px;overflow-wrap:anywhere}
.notice{padding:9px 11px;margin:12px 0 0;background:#f3f6fc;color:#56657b;border:1px solid #e3eaf5;border-radius:3px}
.target-group{margin-top:11px;border:1px solid var(--edge)}
.target-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;background:#f1f4fa;font-weight:650}
.target-head .state{font-weight:400}
.subtable{font-size:12px}
.subtable th,.subtable td{padding:8px 9px;overflow-wrap:anywhere}
.subtable th{background:#f7f8fb}
.subtable td{color:#465367}
.subtable tbody tr:hover{background:#f5f8ff}
.subtable .inline-actions{display:flex;gap:12px;align-items:center}
.counts{white-space:nowrap;font-size:12px;color:#536176}
.small-empty{padding:10px;color:#738092}
.retry-section+.retry-section{margin-top:16px}
.retry-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 14px;min-width:0}
.retry-heading h2,#retry-dialog .icon-close{flex:none}
.retry-section-head{margin:0 0 8px;font-size:13px;font-weight:700;color:#334156}
.retry-summary{margin:0;color:#58667a;font-size:12px}
.retry-summary:empty{display:none}
.retry-summary strong{color:#244cb4}
.retry-links{max-height:min(154px,22dvh);overflow:auto;border:1px solid var(--edge);border-radius:4px}
.retry-links .subtable{min-width:480px}
.retry-links th{position:sticky;top:0;z-index:1}
.retry-links .selected-route td{background:#eef3ff}
.retry-links .selected-route td:first-child{box-shadow:inset 3px 0 var(--blue)}
.retry-links .link[aria-pressed=true]{font-weight:650}
.retry-section .paged-table{max-height:min(405px,48dvh);border-radius:4px}
.toast{position:fixed;z-index:5;top:61px;left:50%;transform:translateX(-50%);border:1px solid #cbdafa;background:#f1f5ff;color:#264fbe;padding:9px 15px;border-radius:4px;box-shadow:0 4px 13px #20365512}
.toast:empty{display:none}
dialog .toast-inline{color:#2456d8;min-height:18px;margin:8px 0 0}
@media(max-width:1100px){.field{flex:1 1 142px}.filter-date{flex:1 1 240px}}
@media(max-width:700px){.topbar{padding:0 10px}.prototype,.avatar{display:none}.topright{gap:5px}.switcher{gap:3px}.switcher select{min-width:91px;max-width:125px}.tab{min-width:0;padding:5px 10px}.tabs{overflow:auto}.filters{margin-bottom:15px}.actions{margin-left:0}main{padding:14px 10px;height:auto}.tableframe{max-height:52vh}.summary{grid-template-columns:1fr}.dialog-header,.dialog-body,.dialog-foot{padding-left:13px;padding-right:13px}.target-group{overflow:auto}.target-group .subtable{min-width:530px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

[hidden]{display:none!important}
button.tab{font-family:inherit;line-height:20px}
.field.data-field{flex:1.4 1 178px}
input[type=text],input[type=search]{width:100%;height:33px;color:#344052;background:#fff;border:1px solid #dce0e7;border-radius:3px;padding:0 10px}
.record-table{min-width:1040px}
#record-view .record-table{min-width:1140px}
.sync-data-cell .link{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-align:left}
#record-view .record-table th:last-child{right:0;z-index:2;box-shadow:-1px 0 var(--edge)}
#record-view .record-table td:last-child{position:sticky;right:0;z-index:1;background:#fff;box-shadow:-1px 0 var(--edge)}
#record-view tbody tr:nth-child(even) td:last-child{background:var(--stripe)}
#record-view tbody tr:hover td:last-child{background:#eaf0ff}
.retry-links{max-height:none;overflow:visible;border:0}
.retry-links .paged-table{max-height:min(310px,35dvh)}
.init-history{margin-top:14px}
.init-history summary{cursor:pointer;color:#455976;margin-bottom:8px}
.row-actions{gap:12px}
#detail-dialog{width:min(1160px,calc(100vw - 36px))}
#manual-dialog,#init-dialog{width:min(960px,calc(100vw - 36px))}
.text-muted,.row-secondary{color:#657388;font-size:12px}
.row-secondary{display:block;margin-top:2px;line-height:1.45}
.small-id{font-variant-numeric:tabular-nums;color:#53647a;font-size:11px}
.summary{margin-bottom:14px}
.summary-counts{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.metric{align-items:center;display:inline-flex;justify-content:center;gap:5px;background:#f9faff;border:1px solid #e3e8f2;color:#4c5b70;border-radius:4px;padding:4px 10px;font-size:12px;min-height:29px}
.metric[aria-pressed=true]{background:#edf3ff;border-color:#aac0fc;color:#2159fc}
.metric strong{font-size:13px}
.detail-controls,.manual-filters,.target-search{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px;margin:0 0 11px}
.detail-controls .field,.manual-filters .field{flex:1 1 125px;min-width:110px;max-width:260px}
.detail-controls .field.wide{flex:2 1 225px;max-width:none}
.portal-results .subtable{min-width:950px}
.portal-results .counts{white-space:normal}
.portal-chain{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;vertical-align:middle}
.chain-node{font-weight:650;color:#344154}
.chain-hop{display:inline-grid;grid-template-rows:12px 6px;min-width:43px;padding:1px 2px 4px;border:0;border-radius:3px;background:transparent;color:#697687;font-size:11px;line-height:12px;text-align:center}
button.chain-hop:hover{background:#eef3ff}
.retry-hop{font-weight:650}
.chain-arrow{position:relative;height:1px;margin:4px 2px 0;background:currentColor}
.chain-arrow::after{content:"";position:absolute;right:0;top:50%;width:5px;height:5px;border:solid currentColor;border-width:1px 1px 0 0;transform:translateY(-50%) rotate(45deg)}
.manual-layout>section{min-width:0}
.sidecar{border:1px solid var(--edge);border-radius:4px;background:#f8fafe;min-width:0;padding:12px 13px;align-self:start}
.sidecar-head,.selection-bar{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.sidecar-head{margin:0 0 9px}
.sidecar-head h3{margin:0;font-size:14px}
.compact-note{color:#5c6a80;font-size:12px;margin:7px 0}
.scope-tags{display:flex;flex-wrap:wrap;gap:4px 7px;margin:6px 0 4px}
.scope-tags span{font-size:11px;white-space:nowrap;border-radius:3px;background:#edf2fc;padding:2px 6px;color:#4d6181}
.manual-summary .summary{grid-template-columns:minmax(0,1fr)}
.manual-scope-value{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.manual-scope-value .scope-tags{margin:0}
.manual-scope-value .scope-tags span{font-size:12px}
.selection-bar{padding:7px 10px;margin:0 0 9px;border:1px solid #e4e9f2;background:#f5f8fd;border-radius:3px;min-height:36px}
.selection-bar .row-actions{flex-wrap:wrap}
.selection-bar strong{color:#294eac;font-size:12px}
input[type=checkbox]{accent-color:var(--blue);vertical-align:middle}
.table-wrap{overflow:auto;border:1px solid var(--edge);border-radius:3px}
.table-wrap .subtable{min-width:495px}
.details-summary-table .subtable{min-width:630px}
.paged-table{max-height:min(357px,43dvh)}
.object-pager{margin-bottom:2px}
.steps{display:flex;list-style:none;margin:0 0 16px;padding:0;border-bottom:1px solid var(--edge);gap:14px}
.steps li{padding:0 1px 8px;color:#657388;font-size:12px;border-bottom:2px solid transparent}
.steps li[aria-current=step]{border-color:var(--blue);color:var(--blue);font-weight:650}
.manual-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.manual-layout.with-sidecar{grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr)}
.manual-result{border:1px solid var(--edge);background:#f8faff;padding:15px;margin:4px 0 0}
.manual-result h3{font-size:15px;margin:0 0 7px}
.selected-groups{max-height:285px;overflow:auto}
.selected-groups details{border-top:1px solid var(--edge);padding:8px 0}
.selected-groups summary{cursor:pointer}
.selected-groups .picked-row{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;gap:7px}
.target-search>input[type=search]{width:min(235px,100%)}
.management-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.management-title h1{font-size:17px;margin:0}
.management-title input{max-width:260px}
.management-table .record-table{min-width:660px}
#detail-feedback:empty{display:none}
.note-line{margin:7px 0}
.inline-empty{border:1px solid var(--edge);border-radius:3px;padding:18px;text-align:center;color:#647386}
@media(max-width:880px){
  .manual-layout.with-sidecar{grid-template-columns:minmax(0,1fr)}
  .with-sidecar .sidecar{grid-row:1}
}
@media(max-width:700px){.management-title{align-items:stretch}.management-title h1{white-space:nowrap}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="apps" aria-hidden="true"></span>
  </div>
  <div class="topright">
    <span class="prototype">原型演示</span>
    <label class="switcher"><span class="avatar" aria-hidden="true">运</span><select id="role" class="select" aria-label="切换演示角色"></select></label>
  </div>
</header>
<nav class="tabs" aria-label="平台页面">
  <span class="tab">首页</span><span class="tab">运行终端管理</span><button class="tab" type="button" id="tab-management" data-action="show-management">级联门户管理</button><button class="tab active" type="button" id="tab-records" data-action="show-records" aria-current="page">级联门户同步记录</button>
</nav>
<main id="record-view" aria-label="级联门户同步记录">
  <form id="filters" class="filters">
    <div class="field"><label for="filter-category">同步分类</label><select class="select" id="filter-category"></select></div>
    <div class="field"><label for="filter-type">同步类型</label><select class="select" id="filter-type"></select></div>
    <div class="field data-field"><label for="filter-data">同步数据</label><input type="search" id="filter-data" placeholder="请输入数据名称或标识"></div>
    <div class="field"><label for="filter-origin">发起门户</label><select class="select" id="filter-origin"></select></div>
    <div class="field"><label for="filter-target">目标门户</label><select class="select" id="filter-target"></select></div>
    <div class="field"><label for="filter-status">状态</label><select class="select" id="filter-status"></select></div>
    <fieldset class="filter-date"><legend>发起时间</legend><div class="daterange"><input type="date" id="filter-start" aria-label="开始日期"><span>至</span><input type="date" id="filter-end" aria-label="结束日期"></div></fieldset>
    <div class="actions"><button type="submit" class="btn primary">查询</button><button type="button" class="btn" id="reset-filters">重置</button><button type="button" class="btn primary" id="go-manual" data-action="manual-start">发起同步</button></div>
  </form>
  <div class="tableframe" tabindex="0" aria-label="同步任务列表">
    <table class="record-table">
      <colgroup><col style="width:11%"><col style="width:12%"><col style="width:20%"><col style="width:8%"><col style="width:10%"><col style="width:10%"><col style="width:14%"><col style="width:7%"><col style="width:8%"></colgroup>
      <thead><tr><th scope="col">同步分类</th><th scope="col">同步类型</th><th scope="col">同步数据</th><th scope="col">触发方式</th><th scope="col">发起门户</th><th scope="col">目标门户</th><th scope="col" aria-sort="descending">发起时间 <span aria-hidden="true">↓</span></th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <footer class="pager">
    <div class="pager-left"><span id="total"></span><select class="select" id="page-size" aria-label="每页条数"><option value="10">10条/页</option><option value="20" selected>20条/页</option><option value="50">50条/页</option></select></div>
    <div class="pager-right"><div class="pagebuttons" id="page-buttons"></div><form class="jump" id="jump"><label for="page-number">前往</label><input type="number" id="page-number" min="1" value="1" aria-label="前往页码"><span>页</span></form></div>
  </footer>
</main>
<main id="portal-management" aria-label="级联门户管理" hidden>
  <div class="management-title"><h1>级联门户管理</h1><input type="search" id="management-keyword" placeholder="搜索门户名称" aria-label="搜索下级门户名称"></div>
  <div class="tableframe management-table" aria-label="下级门户列表" tabindex="0"><table class="record-table">
    <thead><tr><th scope="col">门户名称</th><th scope="col">层级</th><th scope="col">级联路径</th><th scope="col">初始化状态</th><th scope="col">操作</th></tr></thead>
    <tbody id="management-rows"></tbody>
  </table></div>
  <footer class="pager"><span id="management-total"></span><div class="pagebuttons" id="management-pager"></div></footer>
</main>

  const source=ancestors(from), target=ancestors(to);
  let common=0;
  while(source[common]&&source[common]===target[common])common++;
  return [...source.slice(common-1).reverse(),...target.slice(common)];
}

  if(type==="设备上报数据回传")return "回传";

function seed(type,origin,minutes,definitions,config={}){
  const at=sampleTime(minutes);
  const task={
    id:"CL"+String(seeds.length+1).padStart(5,"0"),category:TYPE_TO_CATEGORY[type],type,origin,at,
    edges:new Map(),routes:[],scope:config.scope??[origin],business:config.business,
    trigger:config.trigger??"自动同步",operator:config.operator,queryId:config.queryId,
    init:type==="初始化同步",feedback:""
  };
  task.routes=definitions.map(definition=>{
    const {path,objects,states,failures}=definition;
    const keys=objects.map(item=>item.key??[item.device,item.id].filter(Boolean).join("|"));
    const legs=path.slice(1).map((to,index)=>{
      const from=path[index], key=from+"-"+to;
      if(!task.edges.has(key))task.edges.set(key,{from,to,key,items:new Map(),history:[],updated:null});
      const edge=task.edges.get(key);
      objects.forEach((item,i)=>{
        const itemKey=keys[i];
        if(edge.items.has(itemKey))return;
        const raw=Array.isArray(states[index])?states[index][i]:states[index];
        const status=config.covered&&raw==="fail"?"covered":raw??"pending";
        const changed=status!=="pending"?at+1000+index*1000:null;
        const failure=(status==="fail"||status==="covered")?(failures[index]?.[i]||"目标门户处理超时"):"";
        edge.items.set(itemKey,{
          ...item,key:itemKey,status,changed,attempts:0,
          action:item.action??(task.trigger==="手动同步"?"补同步":defaultAction(type)),
          lastReason:failure,failureTime:failure?changed:null,
          due:status==="running"?Date.now()+(config.delay??1800):null,
          failOnce:definition.failApplication&&index===path.length-2&&item.name==="应用"
        });
        if(changed)edge.updated=Math.max(edge.updated??0,changed);
      });
      return {edge,keys};
    });
    return {target:path.at(-1),legs,terminal:legs.at(-1),targetVisible:true};
  });
  seeds.push(task);
  return task;
}

    if(phase===2&&type!=="应用")description="正式版本信息及同版本文件";
    if(phase===3)description="按 "+portal(target)+" 管辖范围补齐";
    if(phase===5)description="按档案所属单位匹配 "+portal(target);
    return object("INIT-"+(phase+1)+"-"+(index+1),type,{description,phase,amount:
      type==="应用"?8:phase===3?147+index*15:phase===5?38:phase*6+index*3+12});
  }));
}

    const appIndex=objects.findIndex(item=>item.name==="应用");
    states.forEach((state,index)=>objects.forEach((item,i)=>{
      state[i]=item.phase<=2?"success":"pending";
      if(index===states.length-1&&i===appIndex)state[i]="fail";
    }));
    reasons[states.length-1]={[appIndex]:"应用包完整性校验失败，版本未生效"};
  }
  const setup=route(path,objects,states,reasons);
  setup.failApplication=!existing;
  return seed("初始化同步",origin,existing?116:0,[setup],{scope:[target],trigger:"初始化同步"});
}

function permitted(id){return role.scope===null||role.scope.includes(id)}

    if(!permitted(route.target)&&!permitted(task.origin))return [];
    const legs=route.legs.filter(({edge})=>edge.from===role.portal||edge.to===role.portal);
    return legs.length?[{...route,legs,targetVisible:legs.includes(route.terminal)}]:[];
  });
}
function legItems(leg,key){
  return key===undefined?leg.keys.map(id=>leg.edge.items.get(id)):
    leg.keys.includes(key)?[leg.edge.items.get(key)]:[];
}
function routeItems(route,key){
  return route.legs.flatMap(leg=>legItems(leg,key));
}
function count(items){
  const results={success:0,fail:0,pending:0,running:0,covered:0};
  for(const item of items)results[item.status]++;

}
function summarize(items){
  const total=count(items);
  if(total.running)return "running";
  if(total.fail)return "fail";
  if(total.pending)return "pending";
  if(total.covered)return "covered";
  return total.success?"success":null;
}
function routeState(route,key){
  const items=routeItems(route,key);
  if(items.some(item=>item.status==="fail"))return "fail";
  if(items.some(item=>item.status==="running"))return "running";
  return route.targetVisible?summarize(legItems(route.terminal,key)):null;
}
function taskState(routes,key){

  const items=routes.flatMap(route=>routeItems(route,key));
  if(states.length===1&&states[0]==="fail")return "fail";
  if(items.some(item=>item.status==="running"))return "running";
  if(states.includes("fail")){
    return states.includes("success")?"partial":"fail";
  }
  if(states.includes("pending"))return "pending";
  if(items.some(item=>item.status==="covered"))return "covered";
  return states.length&&states.every(state=>state==="success")?"success":null;
}
function dataState(routes,key){

  if(states.includes("running")||states.includes("pending"))return "running";
  if(states.includes("fail"))return states.includes("success")?"partial":"fail";
  if(routes.some(route=>routeItems(route,key).some(item=>item.status==="covered")))return "covered";
  return states.length&&states.every(state=>state==="success")?"success":"unavailable";

function taskItems(routes){

}

function failureLinks(routes,targets=null,edgeKey=null){

    if(targets&&!targets.has(route.target))continue;
    for(const leg of route.legs){
      if(edgeKey&&edgeKey!==leg.edge.key)continue;
      const failed=legItems(leg).filter(item=>item.status==="fail");
      if(!failed.length)continue;
      if(!links.has(leg.edge.key))links.set(leg.edge.key,{edge:leg.edge,items:new Map(),targets:new Set()});
      const entry=links.get(leg.edge.key);

function replaceContent(container,html,preserveInputs=false){

    const previous=scrolls.get(node.dataset.scrollKey);
    if(previous)[node.scrollTop,node.scrollLeft]=previous;
  }
  for(const [id,value] of draft){
    const input=$(id);
    if(input&&container.contains(input)&&(!input.matches("select")||[...input.options].some(option=>option.value===value)))input.value=value;

function drawPortalChain(task,route,retrySegments=null){

    const content=`<span>${stateText}</span><span class="chain-arrow" aria-hidden="true"></span>`;
    const classes=`chain-hop ${marked?"fail":state??""}${marked?" retry-hop":""}`;

function retryUnits(task,items){
  if(!task.queryId)return items.map(item=>({id:item.id,name:item.name,lastReason:item.lastReason,items:[item]}));
  const groups=new Map();
  for(const item of items){
    const batch=item.batch??item.id;
    if(!groups.has(batch))groups.set(batch,{id:task.queryId+" / "+batch,name:batch,lastReason:item.lastReason,items:[]});
    groups.get(batch).items.push(item);
  }
  return [...groups.values()];
}

function visibleHistory(edge,items){

    const outcomes=units.map(unit=>unit.items.filter(item=>keys.has(item.key)).map(item=>attempt.outcomes.get(item.key)));
    const success=outcomes.filter(group=>group.every(status=>status==="success")).length;
    const fail=outcomes.filter(group=>group.includes("fail")).length;
    return {...attempt,total:units.length,success,fail,

function scheduleItem(edge,item,due){
  item.status="running";
  item.due=due;
  item.changed=Date.now();
  edge.updated=item.changed;
}
function startRetry(){
  if(!retrySelection)return;
  const {task}=retrySelection, links=selectedRetryLinks();
  if(!links.length){drawRetry();return}
  const now=Date.now();
  for(const {edge,items,units} of links){
    const attempt={at:now,actor:role.label,units,outcomes:new Map()};
    edge.history.unshift(attempt);
    for(const item of items){
      scheduleItem(edge,item,now+1450);
      item.attempt=attempt;
      item.attempts++;
      item.failOnce=false;
    }
  }
  retryDialog.close();
  drawTable();
  if(segmentDialog.open)drawSegment();
  message("已提交重试，请查看同步状态");
}
function releasePending(task,now){
  let changed=false;
  for(const route of task.routes){
    route.legs.forEach((leg,index)=>{
      const items=legItems(leg), previous=route.legs[index-1];
      for(const item of items){
        if(item.status!=="pending")continue;
        if(previous&&previous.edge.items.get(item.key)?.status!=="success")continue;
        if(!previous&&!task.init)continue;
        if(task.init&&items.some(candidate=>candidate.phase<item.phase&&candidate.status!=="success"))continue;
        scheduleItem(leg.edge,item,now+(task.init?550:1050));
        changed=true;
      }
    });
  }
  return changed;
}
function updateJobs(){
  const now=Date.now();
  let changed=false;
  for(const task of seeds){
    let active=task.init;
    for(const edge of task.edges.values()){
      for(const item of edge.items.values()){
        if(item.status!=="running")continue;
        active=true;
        if(item.due>now)continue;
        item.status=item.failOnce?"fail":"success";
        item.due=null;
        item.changed=edge.updated=now;
        if(item.failOnce){
          item.lastReason="应用包完整性校验失败，版本未生效";
          item.failureTime=now;
          item.failOnce=false;
        }
        if(item.attempt){item.attempt.outcomes.set(item.key,item.status);item.attempt=null}
        changed=true;
      }
    }
    if(active&&releasePending(task,now))changed=true;
  }
  if(!changed)return;
  drawTable();
  if(detail.open)drawDetail(true);
  if(segmentDialog.open)drawSegment();
  if(retryDialog.open)drawRetry(true);
  if(!$("portal-management").hidden)drawManagement();
}

function lowerTargets(origin){
  return PLATFORM.filter(([id])=>id!==origin&&ancestors(id).includes(origin)&&permitted(id)).map(row=>row[0]);
}
function inventory(type){
  if(!MANUAL_CATALOG[TYPE_TO_CATEGORY[type]]?.includes(type))return [];
  const origin=role.portal, isLedger=type==="终端台账"||type==="子设备台账";
  if(!isLedger&&origin!=="net")return [];
  if(isLedger&&!permitted(origin))return [];
  if(type==="子设备台账"&&origin==="net")return [];
  if(type==="型号")return models;
  if(type==="厂商")return vendors;
  if(type==="项目")return projects;
  const entry=BASE_RECORDS[type];
  if(!entry)return [];
  const [prefix,names,portalScopes=[]]=entry;
  return Array.from({length:isLedger?18:names.length},(_,i)=>{
    let owner=origin,targets=portalScopes[i];
    if(type==="子设备台账"){
      targets=ancestors(origin).slice(0,-1).reverse();
    }else if(type==="终端台账"){
      if(origin==="net"){
        owner=["gd","gx","gz"][Math.floor(i/6)];
        targets=[owner];
      }else if(origin==="gd"&&i>=12){
        owner=i<15?"fs":"dg";
        targets=["net",owner];
      }else{
        targets=ancestors(origin).slice(0,-1).reverse();
      }
    }
    const description=isLedger?"所属门户 "+portal(owner):targets?"适用门户 "+targets.map(portal).join("、"):undefined;
    return object(prefix+"-"+String(i+1).padStart(4,"0"),names[i%names.length]+(isLedger?" "+String(i+1).padStart(3,"0"):""),
      {version:"v1",dataType:type,description,targets});
  });
}
function eligibleTargets(type,items){

  const eligible=manualBatchTargets(groups);
  const matched=eligible.filter(id=>normalize(portal(id)).includes(normalize(manual.targetQuery)));
  const empty=eligible.length?"暂无符合条件的目标门户":"所选数据没有共同可同步的目标门户，请返回上一步调整已选数据。";
  return `<div class="manual-summary">${facts([["同步数据",dataSummary]])}</div>
    <form class="detail-controls" id="manual-target-filters">${textField("manual-target-name","门户名称",manual.targetQuery,"请输入目标门户名称",true)}
      <button type="submit" class="btn">筛选</button>${actionButton("重置","manual-target-reset")}</form>
    <div class="selection-bar"><strong>已选 ${manual.targets.size} 个目标门户</strong></div>
    ${pagedTable(matched,manual,"targetPage","manual-target-page",["选择","目标门户","级联路径"],id=>
      tr([`<input type="checkbox" data-manual-target="${id}" aria-label="选择${escapeHtml(portal(id))}" ${manual.targets.has(id)?"checked":""}>`,
        escapeHtml(portal(id)),pathBetween(role.portal,id).map(portal).map(escapeHtml).join(" → ")]),empty)}`;
}
function manualConfirm(groups,dataSummary){
  const targets=[...manual.targets];
  const summary=facts([
    ["发起门户",escapeHtml(portal(role.portal))],
    ["同步数据",dataSummary],
    ["目标门户",manualScopeValue(`${targets.length} 个`,targets.map(portal))]
  ]);
  const records=groups.length>1?`本次将生成 ${groups.length} 条同步记录。`:"";
  return `<div class="manual-summary">${summary}</div><p class="compact-note">按所选数据及版本补同步，提交无需审批。${records}</p>
    ${manual.feedback?`<p class="notice" role="alert">${escapeHtml(manual.feedback)}</p>`:""}`;
}
function manualResult(){
  const submitted=manual.submitted;
  const total=submitted.reduce((sum,{count})=>sum+count,0);
  const typeLabel=submitted.length===1?escapeHtml(submitted[0].task.type):`${submitted.length} 种类型`;
  const records=submitted.length>1?`<div class="table-wrap">${subtable(["同步类型","数据条数","操作"],submitted.map(({task,count})=>
    tr([escapeHtml(task.type),count,button("查看同步记录","manual-view",task)])).join(""))}</div>`:"";
  return `<section class="manual-result" role="status"><h3>已提交同步</h3>
    <p>${typeLabel} · ${total} 条数据 · ${manual.targets.size} 个目标门户</p></section>${records}`;
}
function drawManual(preserveInputs=false){
  if(!manual)return;
  const {step}=manual;
  const groups=manualGroups(), total=groups.reduce((sum,{items})=>sum+items.length,0);
  const steps=["选数据","选目标门户","确认提交"];
  const dataSummary=manualScopeValue(`${groups.length} 种类型，共 ${total} 条`,groups.map(({type,items})=>`${type} ${items.length} 条`));
  const content=step===1?manualData(groups,total):step===2?manualTargets(groups,dataSummary):step===3?manualConfirm(groups,dataSummary):manualResult();
  replaceContent($("manual-body"),`${step<4?`<ol class="steps">${steps.map((text,i)=>`<li${i+1===step?' aria-current="step"':""}>${i+1}. ${text}</li>`).join("")}</ol>`:""}${content}`,preserveInputs);
  const footer=step===4?`${actionButton("关闭","manual-close")}${actionButton("继续发起","manual-continue")}
    ${manual.submitted.length===1?actionButton("查看同步记录","manual-view",true):""}`:
    `${actionButton(step===1?"取消":"上一步",step===1?"manual-close":"manual-back")}${actionButton(step===3?"确认发起":"下一步",step===3?"manual-submit":"manual-next",true,step===1?!groups.length:!manual.targets.size)}`;
  replaceContent($("manual-foot"),footer);
  const header=$("manual-pick-page");
  if(header){
    const items=manualMatches().slice((manual.dataPage-1)*objectPageSize,manual.dataPage*objectPageSize);
    const picked=items.filter(item=>activePicks().has(item.id)).length;
    header.checked=items.length>0&&items.length===picked;
    header.indeterminate=picked>0&&picked<items.length;
  }
}
function changeManualSource(category,type=""){
  if(category&&!Object.hasOwn(MANUAL_CATALOG,category))return;
  if(type&&!MANUAL_CATALOG[category]?.includes(type))return;
  Object.assign(manual,{category,type,criteria:{name:"",code:""},dataPage:1});
  drawManual();
}
function openManual(){
  manual={category:"",type:"",step:1,picks:new Map(),criteria:{name:"",code:""},dataPage:1,
    targets:new Set(),targetPage:1,targetQuery:"",sidebar:false,feedback:""};
  drawManual();
  if(!manualDialog.open)manualDialog.showModal();
  $("manual-category").focus();
}
function submitManual(){
  if(!manual||manual.step!==3)return;
  const groups=manualGroups(), targetIds=[...manual.targets];
  const eligible=manualBatchTargets(groups);
  const allAvailable=groups.every(({type,items})=>{
    const ids=new Set(inventory(type).map(item=>item.id));
    return items.every(item=>ids.has(item.id));
  });
  if(!groups.length||!targetIds.length||!allAvailable||targetIds.some(target=>!eligible.includes(target))){
    manual.feedback="已选数据或目标门户已变化，请返回上一步重新选择。";
    drawManual();
    return;
  }
  const scope=role.portal==="net"?targetIds:[role.portal,...targetIds.filter(target=>lowerTargets(role.portal).includes(target))];
  const paths=targetIds.map(target=>pathBetween(role.portal,target));
  manual.submitted=groups.map(({type,items})=>{
    const data=items.map(item=>({...item,version:item.version??"v1"}));
    const routes=paths.map(path=>route(path,data,path.slice(1).map((_,i)=>i===0?"running":"pending")));
    const task=seed(type,role.portal,0,routes,{scope,trigger:"手动同步",operator:role.label,delay:1600});
    return {task,count:data.length};
  });
  manual.picks.clear();
  manual.step=4;
  refreshPortals();
  drawTable();
  drawManual();
}
function latestInitialization(target){
  return [...seeds].reverse().find(task=>task.init&&task.origin===role.portal&&task.routes.some(route=>route.target===target)&&view(task).length);
}
function showPage(management){
  $("record-view").hidden=management;
  $("portal-management").hidden=!management;
  for(const [id,active] of [["tab-records",!management],["tab-management",management]]){
    $(id).classList.toggle("active",active);
    if(active)$(id).setAttribute("aria-current","page");
    else $(id).removeAttribute("aria-current");
  }
  closePortals();
  if(management)drawManagement();
}
function drawManagement(){
  const keyword=normalize($("management-keyword").value);
  const targets=lowerTargets(role.portal).filter(id=>!keyword||normalize(portal(id)).includes(keyword));
  const pages=Math.max(1,Math.ceil(targets.length/objectPageSize));
  managementPage=Math.min(managementPage,pages);
  const display=targets.slice((managementPage-1)*objectPageSize,managementPage*objectPageSize);
  replaceContent($("management-rows"),display.length?display.map(target=>{
    const task=latestInitialization(target);
    const action=task?button("查看初始化记录","details",task):button("初始化同步","init-open",null,target);
    return tr([escapeHtml(portal(target)),escapeHtml(portalLevel(target)),pathBetween(role.portal,target).map(portal).map(escapeHtml).join(" → "),
      task?label(taskState(view(task))):"未初始化",action],`data-management-target="${target}"`);
  }).join(""):'<tr><td colspan="5" class="empty">暂无符合条件的下级门户</td></tr>');
  $("management-total").textContent="共 "+targets.length+" 个门户";
  replaceContent($("management-pager"),`${actionButton("上一页","management-prev",false,managementPage===1)}
    <span>第 ${managementPage} / ${pages} 页</span>${actionButton("下一页","management-next",false,managementPage===pages)}`);
}
function openInitialization(target){
  if(!lowerTargets(role.portal).includes(target)||latestInitialization(target))return;
  initTarget=target;
  const typeCount=INIT_GROUPS.reduce((sum,group)=>sum+group.types.length,0);
  $("init-body").innerHTML=facts([["发起门户",escapeHtml(portal(role.portal))],["目标门户",escapeHtml(portal(target))],["同步范围",`${typeCount} 种数据类型`]])+
    `<div class="table-wrap">${subtable(["范围","数据类型"],INIT_GROUPS.map(group=>
      tr([escapeHtml(group.name),escapeHtml(group.types.join("、"))])).join(""))}</div>`+
    `<p class="compact-note">菜单、数据字典与系统参数使用定制前的全网通用数据。历史终端档案按档案所属单位同步。</p>`;
  initDialog.showModal();
}
function submitInitialization(){
  const target=initTarget;
  if(!target||!lowerTargets(role.portal).includes(target)||latestInitialization(target))return;
  const task=createInitialization(role.portal,target);
  releasePending(task,Date.now());
  initDialog.close();
  refreshPortals();
  drawTable();
  drawManagement();
  openDetails(task,"init");
}


function changePage(state,key,step,redraw){
  state[key]=Math.max(1,state[key]+Number(step));
  redraw();
}
function selectManualItems(items,checked){
  const picks=activePicks();
  for(const item of items){
    if(checked)picks.set(item.id,item);
    else picks.delete(item.id);
  }
  drawManual(true);
}
function openSegment(task,key,target){
  if(!task)return;
  segmentSelection={task,key,target:target||null,tab:"failures",page:1};
  if(!findSegmentSelection()){segmentSelection=null;return}
  drawSegment();
  segmentDialog.showModal();
}
function clearPortalFilters(){
  Object.assign(detailState,{portalName:"",portalLevel:"",portalStatus:"",portalPage:1});
  drawDetail();
}
document.addEventListener("submit",event=>{
  const id=event.target.id;
  if(!["filters","jump","portal-filters","detail-data-filters","detail-init-filters","manual-data-filters","manual-target-filters"].includes(id))return;
  event.preventDefault();
  switch(id){
    case "filters":{
      const next=filters();
      if(next.start&&next.end&&next.start>next.end){message("开始日期不能晚于结束日期");return}
      if(Object.keys(next).some(key=>next[key]!==criteria[key]))currentPage=1;
      criteria=next;
      drawTable();
      break;
    }
    case "jump":
      currentPage=Math.max(1,Number($("page-number").value)||1);
      drawTable();
      break;
    case "portal-filters":
      Object.assign(detailState,{portalName:$("detail-portal-name").value,portalLevel:$("detail-portal-level").value,
        portalStatus:$("detail-portal-status").value,portalPage:1});
      drawDetail();
      break;
    case "detail-data-filters":
      Object.assign(detailState,{keyword:$("detail-data-keyword").value,dataPage:1});
      drawDetail();
      break;
    case "detail-init-filters":
      Object.assign(detailState,{initName:$("detail-init-name").value,initStatus:$("detail-init-status").value,initPage:1});
      drawDetail();
      break;
    case "manual-data-filters":
      if(!manual.type)break;
      Object.assign(manual,{criteria:{name:$("manual-name").value,code:$("manual-code").value},dataPage:1});
      drawManual();
      break;
    case "manual-target-filters":
      Object.assign(manual,{targetQuery:$("manual-target-name").value,targetPage:1});
      drawManual();
      break;
  }
});
document.addEventListener("change",event=>{
  const node=event.target, key=node.value;
  switch(node.id){
    case "filter-category":
      updateTypes(key,$("filter-type").value);
      return;
    case "role":
      role=ROLES.find(candidate=>candidate.id===key)??ROLES[0];
      criteria=defaults();
      currentPage=managementPage=1;
      $("management-keyword").value="";
      refreshPortals();
      setFilters(criteria);
      drawTable();
      if(!$("portal-management").hidden)drawManagement();
      return;
    case "page-size":
      pageSize=Number(key);
      currentPage=1;
      drawTable();
      return;
    case "manual-category":
      changeManualSource(key);
      return;
    case "manual-type":
      changeManualSource(manual.category,key);
      return;
    case "manual-pick-page":{
      const first=(manual.dataPage-1)*objectPageSize;
      selectManualItems(manualMatches().slice(first,first+objectPageSize),node.checked);
      return;
    }
  }
  if(node.dataset.portalPick&&detailState){
    if(node.checked)detailState.checked.add(node.dataset.portalPick);
    else detailState.checked.delete(node.dataset.portalPick);
    drawDetail(true);
  }
  if(node.dataset.manualPick&&manual){
    const item=inventory(manual.type).find(candidate=>candidate.id===node.dataset.manualPick);
    if(item)selectManualItems([item],node.checked);
  }
  if(node.dataset.manualTarget&&manual){
    const id=node.dataset.manualTarget;
    if(node.checked)manual.targets.add(id);
    else manual.targets.delete(id);
    drawManual(true);
  }
});
document.addEventListener("click",event=>{
  const b=event.target.closest("button[data-action]");
  if(b?.dataset.action!=="show-portals"&&!portalPopover.contains(event.target))closePortals();
  if(!b||b.disabled)return;
  const {action,id,key,step,tab,target,type}=b.dataset;
  const task=seeds.find(task=>task.id===id), current=seeds.find(task=>task.id===detailId);
  switch(action){
    case "page":currentPage=Number(b.dataset.page);drawTable();break;
    case "show-portals":if(task)showPortals(b,task);break;
    case "show-management":showPage(true);break;
    case "show-records":showPage(false);break;
    case "management-prev":managementPage--;drawManagement();break;
    case "management-next":managementPage++;drawManagement();break;
    case "details":openDetails(task,"portals");break;
    case "sync-data":openDetails(task,"data");break;
    case "close-detail":detail.close();break;
    case "detail-tab":
      detailState.tab=tab;
      drawDetail();
      break;
    case "detail-count":
      Object.assign(detailState,{tab:"portals",portalStatus:key,portalPage:1});
      drawDetail();
      break;
    case "detail-data-status":
      Object.assign(detailState,{dataStatus:key,dataPage:1});
      drawDetail(true);
      break;
    case "portal-reset":clearPortalFilters();break;
    case "portal-unselect":detailState.checked.clear();drawDetail(true);break;
    case "portal-page":changePage(detailState,"portalPage",step,()=>drawDetail(true));break;
    case "detail-data-page":changePage(detailState,"dataPage",step,()=>drawDetail(true));break;
    case "clear-detail-data":
      Object.assign(detailState,{keyword:"",dataStatus:"",dataPage:1});
      drawDetail();
      break;
    case "detail-init-page":changePage(detailState,"initPage",step,()=>drawDetail(true));break;
    case "init-detail-reset":
      Object.assign(detailState,{initName:"",initStatus:"",initPage:1});
      drawDetail();
      break;
    case "open-segment":openSegment(task,key,target);break;
    case "close-segment":segmentDialog.close();break;
    case "segment-tab":
      Object.assign(segmentSelection,{tab,page:1});
      drawSegment();
      break;
    case "segment-page":changePage(segmentSelection,"page",step,drawSegment);break;
    case "retry":openRetry(task);break;
    case "retry-all":openRetry(task);break;
    case "retry-portal":openRetry(task,{targets:new Set([key])});break;
    case "retry-selected":openRetry(current,{targets:new Set(detailState.checked)});break;
    case "retry-segment":openRetry(task,{edgeKey:key,targets:target?new Set([target]):null});break;
    case "retry-init-type":openRetry(task,{itemKey:key});break;
    case "select-retry-portal":
    case "select-retry-segment":
      Object.assign(retrySelection,{viewTarget:target,viewEdge:action==="select-retry-segment"?key:null,page:1});
      drawRetry(true);
      break;
    case "retry-page":changePage(retrySelection,"page",step,()=>drawRetry(true));break;
    case "retry-portal-page":
      changePage(retrySelection,"portalPage",step,()=>drawRetry(true));
      $("retry-body").querySelector(".retry-links .paged-table")?.scrollTo(0,0);
      break;
    case "close-retry":retryDialog.close();break;
    case "submit-retry":startRetry();break;
    case "manual-start":openManual();break;
    case "manual-close":manualDialog.close();break;
    case "manual-data-page":changePage(manual,"dataPage",step,()=>drawManual(true));break;
    case "manual-target-page":changePage(manual,"targetPage",step,()=>drawManual(true));break;
    case "manual-pick-matches":selectManualItems(manualMatches(),true);break;
    case "manual-query-reset":
      Object.assign(manual,{criteria:{name:"",code:""},dataPage:1});
      drawManual();
      break;
    case "manual-target-reset":Object.assign(manual,{targetQuery:"",targetPage:1});drawManual();break;
    case "manual-picks":manual.sidebar=!manual.sidebar;drawManual(true);break;
    case "manual-return-type":changeManualSource(TYPE_TO_CATEGORY[key],key);break;
    case "manual-remove":
      manual.picks.get(type)?.delete(key);
      drawManual(true);
      break;
    case "manual-next":
      if(manual.step===1){
        const groups=manualGroups();
        if(!groups.length)break;
        const eligible=manualBatchTargets(groups);
        manual.targets=new Set([...manual.targets].filter(target=>eligible.includes(target)));
      }else if(manual.step!==2||!manual.targets.size)break;
      manual.feedback="";
      manual.step++;
      drawManual();
      $("manual-body").scrollTop=0;
      break;
    case "manual-back":manual.step--;drawManual();$("manual-body").scrollTop=0;break;
    case "manual-submit":submitManual();break;
    case "manual-continue":openManual();break;
    case "manual-view":{
      const selected=task??manual.submitted[0].task;
      manualDialog.close();
      openDetails(selected,"portals");
      break;
    }
    case "init-open":openInitialization(key);break;
    case "init-close":initDialog.close();break;
    case "init-submit":submitInitialization();break;
  }
});
$("reset-filters").addEventListener("click",()=>{criteria=defaults();setFilters(criteria);currentPage=1;drawTable()});
$("management-keyword").addEventListener("input",()=>{managementPage=1;drawManagement()});
detail.addEventListener("close",()=>{if(!detail.open){detailId=null;detailState=null}});
segmentDialog.addEventListener("close",()=>{if(!segmentDialog.open)segmentSelection=null});
retryDialog.addEventListener("close",()=>{if(!retryDialog.open)retrySelection=null});
manualDialog.addEventListener("close",()=>{if(!manualDialog.open)manual=null});
initDialog.addEventListener("close",()=>{if(!initDialog.open)initTarget=null});
document.querySelector(".tableframe").addEventListener("scroll",()=>closePortals());
window.addEventListener("resize",()=>closePortals());
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!portalPopover.hidden)closePortals(true)});

$("role").replaceChildren(...ROLES.map(role=>new Option(role.label,role.id)));
options($("filter-category"),Object.keys(CATALOG).map(category=>[category,category]),"请选择同步分类");
options($("filter-status"),Object.entries(STATUS),"请选择状态");
criteria=defaults();
refreshPortals();
setFilters(criteria);
drawTable();
setInterval(updateJobs,400);

</script>
</body>
</html>
