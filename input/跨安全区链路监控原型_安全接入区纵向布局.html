<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>跨安全区链路通信监控 · 单位视角大屏原型</title>
<style>
/* ==========================================================================
   1. 设计令牌
   ========================================================================== */
:root{
  --bg:#0a1122;
  --cyan:#38c6ff; --blue:#5b8cff; --violet:#9d7bff;
  --green:#2ee6a8; --amber:#ffb648; --red:#ff5f5f;
  --text:#eaf2ff; --muted:#8ba3c9; --dim:#5d7699;
  --card:rgba(16,28,52,.78);
  --card-border:rgba(99,150,255,.14);
  --card-hi:rgba(56,198,255,.09);
  /* 业务语义色：与状态一一对应，全站唯一来源 */
  --st-normal:var(--green);
  --st-blocked:var(--red);
  --st-impact:#af6977;
  --st-metric:var(--amber);
  --st-unknown:#8492a8;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 10px 34px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px;line-height:1.45;
  color:var(--text);background:var(--bg);
  font-variant-numeric:tabular-nums;
  letter-spacing:.2px;
  -webkit-font-smoothing:antialiased;
}
/* 背景：径向光晕 + 网格 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(1100px 560px at 12% -12%, rgba(56,198,255,.12), transparent 60%),
    radial-gradient(900px 480px at 88% 112%, rgba(157,123,255,.10), transparent 60%),
    radial-gradient(700px 420px at 78% -8%, rgba(91,140,255,.08), transparent 55%),
    linear-gradient(180deg,#0c1428 0%,#0a1122 45%,#0a0f1e 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(120,160,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(120,160,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 90% 80% at 50% 30%,#000 35%,transparent 90%);
          mask-image:radial-gradient(ellipse 90% 80% at 50% 30%,#000 35%,transparent 90%);
}
b,strong{font-weight:700}
button,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(99,150,255,.25);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(99,150,255,.4)}

/* ==========================================================================
   2. 顶栏
   ========================================================================== */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  min-height:66px;padding:10px 20px;
  background:rgba(9,15,30,.72);
  border-bottom:1px solid var(--card-border);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.logo{width:38px;height:44px;filter:drop-shadow(0 0 10px rgba(56,198,255,.45))}
.brand-txt h1{
  font-size:19px;font-weight:700;letter-spacing:1.6px;white-space:nowrap;
  background:linear-gradient(90deg,#bfe6ff,#38c6ff 45%,#9d7bff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.brand-txt p{font-size:10px;color:var(--dim);letter-spacing:1.3px;margin-top:2px;white-space:nowrap}
.tb-center{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center}
.field{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:8px;
  border:1px solid var(--card-border);background:rgba(20,32,56,.6);
  color:var(--muted);font-size:12.5px;white-space:nowrap;
  transition:border-color .2s,background .2s;
}
.field:hover{border-color:rgba(56,198,255,.4);background:var(--card-hi)}
.field select{
  border:0;outline:0;background:transparent;color:var(--text);
  font-size:12.5px;max-width:136px;cursor:pointer;
}
.field select:disabled{color:var(--dim);cursor:not-allowed}
.field option{background:#10243d;color:var(--text)}
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:8px;font-size:12.5px;
  color:var(--muted);border:1px solid var(--card-border);
  background:rgba(20,32,56,.55);
  transition:all .2s;user-select:none;white-space:nowrap;
}
.btn:hover{color:var(--text);border-color:rgba(56,198,255,.45);background:var(--card-hi)}
.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.btn.primary{
  color:#04121f;font-weight:700;border-color:transparent;
  background:linear-gradient(90deg,var(--cyan),var(--blue));
  box-shadow:0 0 16px rgba(56,198,255,.28);
}
.btn.primary:hover{filter:brightness(1.08)}
.btn.on{color:#a9f5d8;border-color:rgba(46,230,168,.45);background:rgba(46,230,168,.08)}
.tb-right{display:flex;align-items:center;gap:10px;flex:none;margin-left:auto}
.clock{text-align:right;line-height:1.15;min-width:86px}
.clock .ct{font-size:20px;font-weight:700;letter-spacing:1.4px;text-shadow:0 0 14px rgba(56,198,255,.35)}
.clock .cd{font-size:10px;color:var(--dim);letter-spacing:.8px}

/* ==========================================================================
   3. 页面骨架
   ========================================================================== */
.page{padding:10px 20px 8px;display:flex;flex-direction:column;gap:12px}

/* 单位概况状态卡（原「状态横幅 + 统计口径」已并入 KPI 首卡，此行为唯一口径） */
.kpi.status{padding-left:19px}
.kpi.status::after{
  content:"";position:absolute;inset:0 auto 0 0;width:3px;
  border-radius:var(--radius) 0 0 var(--radius);
  background:var(--st-unknown);box-shadow:0 0 14px var(--st-unknown);
}
.kpi.status.danger::after{background:var(--st-blocked);box-shadow:0 0 14px var(--st-blocked)}
.kpi.status.warn::after{background:var(--st-metric);box-shadow:0 0 14px var(--st-metric)}
.kpi.status.ok::after{background:var(--st-normal);box-shadow:0 0 14px var(--st-normal)}

/* KPI 条（4 卡：当前单位概况 + 平均时延 + 链路吞吐量 + 今日告警） */
.kpi-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{
  position:relative;overflow:hidden;
  min-height:72px;padding:12px 17px 11px;border-radius:var(--radius);
  border:1px solid var(--card-border);
  background:linear-gradient(160deg,rgba(19,32,58,.85),rgba(10,18,34,.85));
  box-shadow:0 8px 28px rgba(0,0,0,.3);
  /* 标签与数值同行（原为上下三行），整卡压矮约 33px */
  display:flex;flex-direction:column;justify-content:center;
}
.kpi::before{
  content:"";position:absolute;top:0;left:16px;right:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(56,198,255,.55),transparent);
}
.kpi-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
/* 首卡状态胶囊：与「异常对象清单」的状态 chip 同族，承载「状态」而非「计数」 */
.kpi-chip{
  font-size:14px;font-weight:700;letter-spacing:.4px;white-space:nowrap;
  padding:3px 11px;border-radius:999px;
  color:#a9b6c8;background:rgba(132,146,168,.12);border:1px solid rgba(132,146,168,.4);
}
.kpi-chip.danger{color:#ffb3b3;background:rgba(255,95,95,.12);border-color:rgba(255,95,95,.4)}
.kpi-chip.warn{color:#ffd9a0;background:rgba(255,182,72,.12);border-color:rgba(255,182,72,.4)}
.kpi-chip.ok{color:#a8f0d4;background:rgba(46,230,168,.12);border-color:rgba(46,230,168,.4)}
.kpi-label{font-size:13.5px;color:#9fb0c8;letter-spacing:.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.kpi-label i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--dim)}
.kpi-value{margin-top:0;font-size:25px;font-weight:750;letter-spacing:.4px;line-height:1.2;white-space:nowrap}
.kpi-value .unit{font-size:13px;color:#91a4c0;margin-left:4px;font-weight:500;letter-spacing:0}
.kpi-sub{font-size:12.5px;color:#8296b4;margin-top:6px;line-height:1.4}
.kpi.danger .kpi-label i{background:var(--st-blocked);box-shadow:0 0 8px var(--st-blocked)}
.kpi.danger .kpi-value{color:#ffc9c9}
.kpi.warn .kpi-label i{background:var(--st-metric);box-shadow:0 0 8px var(--st-metric)}
.kpi.warn .kpi-value{color:#ffe0b3}
.kpi.unknown .kpi-label i{background:var(--st-unknown)}
.kpi.ok .kpi-label i{background:var(--st-normal);box-shadow:0 0 8px var(--st-normal)}

/* ==========================================================================
   4. 卡片通用
   ========================================================================== */
.card{
  position:relative;border-radius:var(--radius);
  border:1px solid var(--card-border);
  background:linear-gradient(165deg,rgba(18,31,58,.85),rgba(9,17,33,.9));
  box-shadow:var(--shadow);backdrop-filter:blur(10px);
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:1px;border-radius:var(--radius) var(--radius) 0 0;
  background:linear-gradient(90deg,rgba(56,198,255,.02),rgba(56,198,255,.5),rgba(157,123,255,.28),rgba(56,198,255,.02));
}
.card-head{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 17px 10px;border-bottom:1px solid rgba(99,150,255,.09);
}
.card-head h2,.card-head h3{
  font-size:14px;font-weight:700;letter-spacing:.9px;
  display:flex;align-items:center;gap:9px;flex:none;
}
.card-head h2::before,.card-head h3::before{
  content:"";width:4px;height:14px;border-radius:2px;
  background:linear-gradient(180deg,var(--cyan),var(--blue));
  box-shadow:0 0 8px rgba(56,198,255,.5);
}
.card-head .right{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}

/* 图例（含悬浮说明） */
.legend{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-left:auto}
.legend .lg{display:flex;align-items:center;gap:6px;cursor:help;border-radius:5px;padding:2px 4px;transition:background .18s}
.legend .lg:hover{background:rgba(56,198,255,.1);color:var(--text)}
.legend .lg:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

/* 状态胶囊 */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10.5px;font-weight:600;letter-spacing:.3px;
  padding:1.5px 9px;border-radius:999px;white-space:nowrap;
  border:1px solid transparent;
}
.chip.normal{color:var(--st-normal);background:rgba(46,230,168,.12);border-color:rgba(46,230,168,.4)}
.chip.abnormal{color:#ffb3b3;background:rgba(255,95,95,.12);border-color:rgba(255,95,95,.42)}
.chip.unknown{color:#c3cddd;background:rgba(132,146,168,.14);border-color:rgba(132,146,168,.42)}
.chip.partialAbnormal{color:#ffd0a0;background:rgba(255,182,72,.12);border-color:rgba(255,182,72,.42)}
.chip.partialUnknown{color:#bcd4ff;background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.4)}
[data-tip]{cursor:help}

/* ==========================================================================
   5. 主体两栏 / 底栏
   ========================================================================== */
/* 主栏行高由拓扑卡决定；侧栏 contain:size 使其不参与行高计算，避免左栏底部留出空洞 */
/* 外层网格：左列 = 拓扑卡（行 1）+ 底栏（行 2）；右列 = 侧栏（跨两行）。
   侧栏跨两行的目的：实时告警可向下延伸（613px → 约 967px），
   而指标趋势只让出宽度（1048 → 约 680px）、高度不变，页面总高不增。 */
.main-grid{display:grid;grid-template-columns:minmax(0,1fr) 356px;grid-template-rows:auto auto;
  gap:12px;align-items:stretch}
.topology-card{grid-column:1;grid-row:1}
.bottom-grid{grid-column:1;grid-row:2}
.side{grid-column:2;grid-row:1 / span 2}
.side{
  display:grid;grid-template-rows:auto minmax(0,1fr);gap:12px;
  min-width:0;min-height:0;contain:size;
}
.bottom-grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;align-items:stretch}
/* 底栏两卡等高：列表卡随行高伸展，避免卡内留白 */
.bottom-grid>.card{display:flex;flex-direction:column;min-height:0}

/* ==========================================================================
   6. 拓扑
   ========================================================================== */
.topology-card{overflow:hidden}
.topo{overflow-x:auto;overflow-y:hidden;padding:16px 18px 14px;scroll-behavior:smooth;scrollbar-gutter:stable;overscroll-behavior-inline:contain}
.topo::-webkit-scrollbar{height:9px}
.topo::-webkit-scrollbar-track{background:rgba(56,198,255,.05);border-radius:999px}
.topo::-webkit-scrollbar-thumb{background:linear-gradient(90deg,rgba(56,198,255,.42),rgba(91,140,255,.55));border-radius:999px;border:2px solid rgba(10,17,34,.7)}
.topo-scroll-note{position:absolute;z-index:8;right:18px;top:60px;padding:4px 10px;border-radius:999px;font-size:10.5px;color:#a9d8ff;background:rgba(8,18,36,.9);border:1px solid rgba(56,198,255,.28);pointer-events:none;opacity:.9}
.topo-canvas{position:relative;min-width:1462px}
.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}

/* 链路选择条 */
.lanes{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0}
/* 链路方向线型图例：实线 = 下行，点线 = 上行；颜色复用 --st-* 语义色，不新增颜色 */
/* 链路条内的方向标签组：线型说明（dir:rule）挂在这一组的悬浮提示上，不再常显 */
.lane-dirs{display:inline-flex;align-items:center;gap:9px}
.lane{
  position:relative;overflow:hidden;text-align:left;
  /* 单行紧凑形态（原为上下两行、85.7px 高） */
  display:inline-flex;align-items:center;gap:9px;
  padding:5px 11px;border-radius:var(--radius-sm);
  border:1px solid rgba(99,150,255,.12);background:rgba(20,34,62,.5);
  transition:all .2s;
}
.lane:hover{border-color:rgba(56,198,255,.42);background:rgba(24,40,72,.62)}
.lane.selected{
  border-color:rgba(56,198,255,.6);
  background:linear-gradient(90deg,rgba(56,198,255,.13),rgba(56,198,255,.02));
  box-shadow:inset 3px 0 0 var(--cyan),0 0 18px rgba(56,198,255,.12);
}
.lane.muted{opacity:.45}
.lane-top{display:inline-flex;align-items:center;gap:8px}
.lane-name{font-size:12.5px;font-weight:700;letter-spacing:.3px}
.lane-name em{font-style:normal;color:var(--dim);font-size:10.5px;margin-left:5px;font-weight:400}
.lane-meta{display:inline-flex;align-items:center;gap:9px;margin-top:0;font-size:10.5px;color:var(--dim);flex-wrap:nowrap}
.lane-meta .blk{color:#ffb3b3}

/* 深圳链路行 × 分区列矩阵：
   行 1 列标题 / 行 2 间隔 18px / 行 3 链路 1 / 行 4 间隔 28px / 行 5 链路 2。
   已去除网级层；两条深圳模拟链路各自占一行，节点与装置不共用。
   列 1 层标签 / 2,4,6,8,10 分区 / 3,5,7,9 装置列（本轮仅使用 3/5/7）。
   分区列固定 **232px**、装置列固定 **68px**（装置不再用负边距溢出到分区列里）：
   原先是 1fr 分区列（1920 视口下 264.8px，每列空 50.4px）+ 48px 装置列 + 装置左右各溢出 10px。
   现改为「分区列 232 + 装置列 68」——装置仍**居中于分区列分界线上**（观感不变），
   但占的是自己的列宽，于是画布下限从 1570 降到 1462，1920 视口下不再横向滚动。
   分区列 232 = 卡片 164 + 两侧各 34px，这 34px 正是「卡片 ⇄ 装置」跳线所需长度（D6 阈值 30px）。

   行间距继续用「间隔行」而非统一 row-gap，以保证两条链路的竖向位置稳定。 */
.topo-grid{
  display:grid;
  width:max-content;margin:0 auto;
  grid-template-columns:30px repeat(4, 232px 68px) 232px;
  grid-template-rows:auto 18px 92px 28px 92px;
  /* 列间距为 0，装置由独立列承载；行 3 / 5 分别承载两条独立链路 */
  gap:0;
  align-items:stretch;
}
/* 分区列底板：纯装饰，铺在节点之下，让「一列＝一个分区」显式可见 */
.zone-bg{
  /* 只画竖向分隔线：简图中分区由顶部列标题整体标识，
     整列填色会在网级/跨层等空行留下大片空框 */
  border-left:1px solid rgba(99,150,255,.10);
  border-right:1px solid rgba(99,150,255,.10);
  background:rgba(16,30,54,.22);
}
/* 顶部列标题：分区名整体标识该列，卡片内不再重复分区说明 */
.zone-head{display:flex;align-items:center;gap:7px;padding:0 2px 8px;border-bottom:1px dashed rgba(99,150,255,.16)}
.zone-head b{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:700;letter-spacing:.6px;color:#dbe9ff;white-space:nowrap;
}
.zone-head b::before{
  content:"";width:3px;height:12px;border-radius:2px;
  background:linear-gradient(180deg,var(--cyan),var(--blue));
  box-shadow:0 0 8px rgba(56,198,255,.45);
}
/* 网级与深圳之间的横向分割线：置于网级行的行间距中，横跨全宽 */
/* 分割线与跨层装置横条都落在「间隔行 4」（104px）内：
   分割线在间隔行起点下移 68px；横条顶边下移 35px（高 34px）→ 横条底边压过分割线 1px，
   视觉上「压在线上」。上下跳线各 35px（阈值 30px）。
   两者用 align-self:start（原先靠 end + 58px 偏移，那是统一 row-gap 时代的写法）。 */
.layer-divider{
  align-self:start;height:1px;transform:translateY(68px);
  background:linear-gradient(90deg,rgba(99,150,255,0) 0%,rgba(120,170,255,.72) 8%,
    rgba(120,170,255,.72) 92%,rgba(99,150,255,0) 100%);
}
/* 左侧层标签：竖排 */
.boundary-line{justify-self:center;align-self:stretch;width:1px;background:rgba(99,150,255,.22)}
.band{
  align-self:start;transform:translateY(35px);margin:0 14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  height:34px;border-radius:6px;
  border:1px solid rgba(91,140,255,.34);
  background:linear-gradient(90deg,rgba(28,44,80,.96),rgba(14,24,44,.96));
  transition:all .2s;
}
.band:hover{border-color:var(--blue);box-shadow:0 0 18px rgba(91,140,255,.3)}
.band:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.band .band-name{font-size:10.5px;font-weight:700;color:#cfe0ff;white-space:nowrap}
.band .band-metrics{display:flex;gap:9px}
.band .band-metrics em{font-style:normal;font-size:9px;color:var(--dim);white-space:nowrap}
.band .band-metrics b{font-weight:700;color:var(--text)}
.band.is-abnormal{border-color:rgba(255,95,95,.55);animation:blinkBorder .95s infinite}
.band.is-abnormal .band-name{color:#ffb3b3}
/* 上游中断：跨层装置横条同样适用 */
.band.is-impact{border-color:rgba(175,105,119,.5)}
.band.is-impact .band-name{color:#e2b0bd}
.node.dim,.bar.dim,.band.dim{opacity:.4}
.layer-label{
  /* 列宽已收窄到 30px，层标签改为靠右对齐：紧贴第一个分区列，不再悬在左侧空白里 */
  display:flex;align-items:center;justify-content:flex-end;
  border-radius:var(--radius-sm);
  border:1px solid rgba(99,150,255,.13);background:rgba(20,34,62,.5);
}
.layer-label span{writing-mode:vertical-rl;letter-spacing:5px;font-size:11.5px;font-weight:700;color:#8fb2e0}
/* 单元格：同格多节点纵向堆叠、顶部对齐，使「第 N 张卡」在相邻列横向对齐 */
.cell{display:flex;flex-direction:column;justify-content:flex-start;align-items:center;gap:9px;min-width:0}
.cell .node{max-width:164px}
.cell .node .node-metrics span{white-space:nowrap}
.cell .node .node-metrics b{font-size:9px}
.cell .empty{font-size:10.5px;color:var(--dim);text-align:center;padding:14px 0}
/* 装置竖条：跨在相邻两列之间；同格多装置纵向堆叠，与同行的卡片一一对齐。
   装置列本身已是 68px（装置宽度），故横向不再需要负边距——负边距会把装置
   挤进分区列、把「卡片 ⇄ 装置」跳线压到 2px。
   上下各 -12px：竖条 116px 比卡片 92px 高 24px，上下各让出 12px 后
   该行轨道高度就等于卡片高度（网级行 104 → 92px），而竖条视觉位置不变。 */
.bar-cell{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:9px;
  min-width:0;margin:-12px 0 -12px}
.bar{
  position:relative;height:116px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 4px;border-radius:6px;
  border:1px solid rgba(91,140,255,.34);
  background:linear-gradient(180deg,rgba(28,44,80,.92),rgba(14,24,44,.92));
  transition:all .2s;
}
.bar:hover{border-color:var(--blue);box-shadow:0 0 18px rgba(91,140,255,.3)}
.bar:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.bar .bar-name{writing-mode:vertical-rl;letter-spacing:1.2px;font-size:10.5px;font-weight:700;color:#cfe0ff}
.bar .bar-metrics{display:flex;gap:5px}
.bar .bar-metrics em{
  font-style:normal;writing-mode:vertical-rl;letter-spacing:.3px;
  font-size:9px;color:var(--dim);white-space:nowrap;
}
.bar .bar-metrics b{font-weight:700;color:var(--text)}
.bar.is-abnormal{border-color:rgba(255,95,95,.55);animation:blinkBorder .95s infinite}
.bar.is-abnormal .bar-name{color:#ffb3b3}
/* 上游中断：装置竖条同样适用（原先只有 .node.is-impact，装置即使带上该类也没有样式） */
.bar.is-impact{border-color:rgba(175,105,119,.5)}
.bar.is-impact .bar-name{color:#e2b0bd}
/* 聚焦环：装置竖条与横条同样需要（原先只有 .node.focus，装置带上 focus 类也看不见）。
   用 outline 而非 box-shadow —— 异常态用 blinkBorder 动画驱动 box-shadow，用 outline 才不会互相覆盖。 */
.bar.focus,.band.focus{border-color:var(--cyan);outline:2px solid rgba(56,198,255,.55);outline-offset:1px}
.bar.is-unknown{border-color:rgba(132,146,168,.5)}
.bar.is-unknown .bar-name{color:#c3cddd}
.node.device .node-name{font-size:10.5px;padding-right:6px;letter-spacing:.2px}
.node.device{padding-left:8px;padding-right:8px}

/* 原「分区列」（安全一区至四区四列）已由上方「层级行 × 分区列」矩阵取代 */

/* 节点 / 装置卡片
   统一卡片高度：多链路时同一单元格会堆叠多张卡，若服务卡与装置卡高度不同，
   顶部对齐后「第 N 张卡」的中心仍会错位，连线在装置处产生台阶（实测 6px）。
   统一高度 + 顶部对齐后，同一序号的卡片在相邻单元格完全横向对齐。 */
.node{
  position:relative;width:100%;text-align:left;
  height:92px;display:flex;flex-direction:column;justify-content:center;
  padding:7px 8px 6px;border-radius:var(--radius-sm);
  border:1px solid rgba(46,230,168,.3);
  background:linear-gradient(175deg,rgba(24,42,78,.9),rgba(12,22,42,.9));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 6px 18px rgba(0,0,0,.3);
  transition:transform .2s,box-shadow .25s,border-color .25s;
}
.node:hover{transform:translateY(-3px);border-color:var(--st-normal);box-shadow:0 0 20px rgba(46,230,168,.28)}
.node:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.node .statusdot{
  position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;
  background:var(--st-normal);box-shadow:0 0 8px rgba(46,230,168,.8);animation:pulse 2.2s infinite;
}
.node-top{display:flex;align-items:center;gap:9px}
.node-ic{width:26px;height:29px;flex:none;color:#7fe8c4;filter:drop-shadow(0 0 7px rgba(46,230,168,.3))}
.node-ic svg{width:100%;height:100%;display:block}
.node-name{font-size:12.5px;font-weight:700;letter-spacing:.3px;line-height:1.25;padding-right:12px}
.node-sub{font-size:9.5px;color:var(--dim);margin-top:2px;letter-spacing:.2px}
.node-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 6px;margin-top:5px}
.node-metrics span{
  display:flex;align-items:baseline;justify-content:space-between;gap:5px;
  font-size:9.5px;color:var(--dim);min-width:0;
  padding:1px 5px;border-radius:5px;background:rgba(56,198,255,.05);
}
/* 指标数为奇数时，末项跨满整行，避免半行留白 */
.node-metrics span:last-child:nth-child(odd){grid-column:1 / -1}
.node-metrics b{color:var(--text);font-size:10px;font-weight:700;white-space:nowrap}
/* 节点状态变体 */
.node.is-abnormal{border-color:rgba(255,95,95,.55);animation:blinkBorder .95s infinite}
.node.is-abnormal .statusdot{background:var(--st-blocked);box-shadow:0 0 10px var(--st-blocked);animation:blink .7s infinite}
.node.is-abnormal .node-ic{color:#ffb3b3;filter:drop-shadow(0 0 8px rgba(255,95,95,.45))}
.node.is-abnormal:hover{border-color:var(--st-blocked);box-shadow:0 0 22px rgba(255,95,95,.3)}
.node.is-impact{border-color:rgba(175,105,119,.5)}
.node.is-impact .statusdot{background:var(--st-impact);box-shadow:0 0 8px var(--st-impact);animation:none}
.node.is-impact .node-ic{color:#e2b0bd}
.node.is-metric{border-color:rgba(255,182,72,.45)}
.node.is-metric .statusdot{background:var(--st-metric);box-shadow:0 0 8px var(--st-metric);animation:none}
.node.is-metric .node-ic{color:#ffd9a0}
.node.is-unknown{border-color:rgba(132,146,168,.45)}
.node.is-unknown .statusdot{background:var(--st-unknown);box-shadow:none;animation:none}
.node.is-unknown .node-ic{color:#c3cddd}
.node.focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(56,198,255,.5),0 0 24px rgba(56,198,255,.22)}

/* ==========================================================================
   7. 连接线
   ========================================================================== */
.edge-path{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .2s}
.edge-path.normal{stroke:url(#g-normal);stroke-width:2.2}
.edge-path.abnormal{stroke:url(#g-abnormal);stroke-width:2.2}
.edge-path.interrupted{stroke:url(#g-fault);stroke-width:2.4;
  animation:dashMove 1s linear infinite, svgBlink .9s infinite}
/* 「受阻」= 该方向自身未故障，但因上游阻断收不到数据（沿用 --st-impact 上游中断语义色）。
   与 interrupted 的区别：不闪烁（不是本段故障），只换色 */
.edge-path.impact{stroke:url(#g-impact);stroke-width:2.1}
.edge-path.unknown{stroke:url(#g-unknown);stroke-width:2}
/* 线型即方向：实线 = 下行，点线 = 上行（与源图图例一致） */
.edge-path.up{stroke-dasharray:5 6}
.edge-path.interrupted.up{stroke-dasharray:9 6}
/* 未选中链路：每跳只画 1 条居中细线；方向信息由链路选择条与分段条目承载 */
.edge-path.solo{stroke-width:1.4;stroke-dasharray:none;opacity:.42}
.edge-path.dim{opacity:.34}
.edge-path.hi{filter:drop-shadow(0 0 7px rgba(56,198,255,.6))}
/* 方向线型图例 / 链路选择条内的线型图元 */
.ll-line{display:inline-block;width:22px;height:0;border-top:2px solid currentColor;flex:none}
.ll-line.up{border-top-style:dotted;border-top-width:3px}
.lane-meta .dirs{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.flow-dot{fill:var(--cyan);filter:drop-shadow(0 0 4px var(--cyan))}
/* 不通徽标：压在斜纹隔离带上，须用实底保证可读（半透明底会被斜纹干扰） */
.edge-badge{fill:rgba(46,10,14,.94);stroke:rgba(255,95,95,.72);stroke-width:1}
.edge-badge-txt{font-size:9px;letter-spacing:.6px;fill:#ffc9c9}

/* ==========================================================================
   8. 侧栏：异常清单 / 实时告警
   ========================================================================== */
.list{padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px}
/* 链路全部通畅时异常清单为空，需给出明确空态而非留白 */
.list-empty{font-size:11px;color:var(--dim);text-align:center;padding:18px 0}
.exception{
  position:relative;width:100%;text-align:left;
  padding:8px 11px;border-radius:var(--radius-sm);
  border:1px solid rgba(99,150,255,.1);background:rgba(20,34,62,.5);
  border-left:3px solid var(--dim);
  transition:all .18s;
}
.exception:hover{border-color:rgba(56,198,255,.4);background:rgba(24,40,72,.62)}
.exception.active{border-color:rgba(56,198,255,.55);background:linear-gradient(90deg,rgba(56,198,255,.1),rgba(56,198,255,.02))}
.exception.critical{border-left-color:var(--st-blocked)}
.exception.warn{border-left-color:var(--st-metric)}
.exception.unknown{border-left-color:var(--st-unknown)}
/* 归属高亮/降噪：清单与告警均为**全量**，不随选中链路过滤（基线 §16.8）。
   属于当前选中链路的条目高亮，其余降噪；但**严重条目始终全亮**，避免降噪掩盖故障。 */
.exception.is-sel{border-color:rgba(56,198,255,.34);
  background:linear-gradient(90deg,rgba(56,198,255,.10),rgba(56,198,255,.02))}
.exception.dim{opacity:.5}
.exception-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.exception-top b{font-size:12px;letter-spacing:.2px}
.exception-top span{font-size:10px;color:var(--dim);white-space:nowrap}
.exception small{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.exception .imp{display:block;font-size:10px;color:var(--dim);margin-top:3px}

.alarm-card{display:flex;flex-direction:column;min-height:0}
.live{
  display:inline-flex;align-items:center;gap:6px;margin-left:auto;
  font-size:10.5px;color:var(--st-normal);letter-spacing:.6px;
  padding:2px 9px;border-radius:999px;
  border:1px solid rgba(46,230,168,.36);background:rgba(46,230,168,.08);
}
.live i{width:6px;height:6px;border-radius:50%;background:var(--st-normal);box-shadow:0 0 8px var(--st-normal);animation:pulse 1.6s infinite}
.live.off{color:var(--dim);border-color:rgba(132,146,168,.3);background:rgba(132,146,168,.08)}
.live.off i{background:var(--dim);box-shadow:none;animation:none}
.afilter{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px 0}
.fchip{
  font-size:11px;color:var(--muted);
  padding:3px 11px;border-radius:999px;
  border:1px solid rgba(99,150,255,.18);background:rgba(20,34,62,.5);
  transition:all .18s;white-space:nowrap;
}
.fchip:hover{color:var(--text);border-color:rgba(56,198,255,.4)}
.fchip.on{color:#04121f;font-weight:700;border-color:transparent;background:linear-gradient(90deg,var(--cyan),var(--blue))}
.fchip i{font-style:normal;margin-left:4px;opacity:.8}
.alarm-list{
  padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px;
  flex:1 1 auto;min-height:0;overflow-y:auto;
}
.alarm-item{
  border-radius:var(--radius-sm);padding:7px 10px;
  border:1px solid rgba(99,150,255,.1);background:rgba(20,34,62,.5);
  border-left:3px solid var(--dim);
  animation:slideIn .35s ease;
}
.alarm-item.sev-critical{border-left-color:var(--st-blocked)}
.alarm-item.sev-warn{border-left-color:var(--st-metric)}
.alarm-item.sev-info{border-left-color:var(--blue)}
/* 与异常清单同一套归属高亮/降噪规则（严重条目始终全亮） */
.alarm-item.is-sel{border-color:rgba(56,198,255,.34);background:rgba(24,40,72,.66)}
.alarm-item.dim{opacity:.5}
.alarm-top{display:flex;align-items:center;gap:7px}
.sev-chip{font-size:9.5px;padding:1px 8px;border-radius:999px;letter-spacing:.4px;white-space:nowrap}
.sev-chip.critical{color:#ffb3b3;background:rgba(255,95,95,.12);border:1px solid rgba(255,95,95,.4)}
.sev-chip.warn{color:#ffd9a0;background:rgba(255,182,72,.12);border:1px solid rgba(255,182,72,.4)}
.sev-chip.info{color:#a9d8ff;background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.4)}
.alarm-time{font-size:10px;color:var(--dim);white-space:nowrap}
.alarm-state{margin-left:auto;font-size:9.5px;color:var(--muted);white-space:nowrap}
.alarm-state.open{color:#ffb3b3}
.alarm-src{font-size:10.5px;color:var(--muted);margin-top:4px}
.alarm-msg{font-size:11.5px;color:var(--text);margin-top:2px;line-height:1.45}
.alarm-empty{font-size:11px;color:var(--dim);text-align:center;padding:18px 0}

/* ==========================================================================
   9. 底栏：业务链路 / 指标趋势
   ========================================================================== */
.path-list{padding:9px 11px 11px;display:flex;flex-direction:column;gap:7px;flex:1 1 auto;min-height:0;overflow-y:auto;scroll-behavior:smooth;scrollbar-gutter:stable;
  /* 必须给上限：卡片高度由内容驱动时，overflow 不会滚动，反而会把底栏顶高
     （多链路后 2 组 + 7 条目曾把底栏从 342px 顶到 911px）。取趋势卡自然高度减去头部 */
  max-height:310px}
.path-item{
  position:relative;width:100%;text-align:left;
  padding:9px 11px;border-radius:var(--radius-sm);
  border:1px solid rgba(99,150,255,.1);background:rgba(20,34,62,.5);
  transition:all .18s;
  /* 条目按内容高度排布；列表整体可滚动，不逐条拉伸 */
  display:flex;flex-direction:column;justify-content:center;flex:0 0 auto;
}
/* 链路分组头：多条链路时按链路分组，组头可点击选中 */
.path-group{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 10px;border-radius:var(--radius-sm);
  border:1px solid rgba(99,150,255,.18);background:rgba(20,34,62,.55);
  transition:all .18s;
}
.path-group:hover{border-color:rgba(56,198,255,.42);background:rgba(24,40,72,.62)}
.path-group.on{border-color:rgba(56,198,255,.6);box-shadow:inset 3px 0 0 var(--cyan)}
.path-group .pg-name{font-size:12px;font-weight:700}
.path-group .pg-meta{margin-left:auto;font-size:10px;color:var(--dim)}
/* 分段条目缩进挂在所属链路下 */
.path-item.is-seg{margin-left:14px;border-left:2px solid rgba(56,198,255,.22)}
.path-item:hover{border-color:rgba(56,198,255,.4);background:rgba(24,40,72,.62)}
.path-item.active{
  border-color:rgba(56,198,255,.55);
  background:linear-gradient(90deg,rgba(56,198,255,.1),rgba(56,198,255,.02));
  box-shadow:inset 3px 0 0 var(--cyan);
}
.path-item .pi-top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.path-item .pi-name{font-size:12.5px;font-weight:700}
.path-item small{display:flex;gap:10px;font-size:10.5px;color:var(--dim);margin-top:4px;flex-wrap:wrap}
.pi-route{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:7px}
.pi-route b{
  font-size:9.5px;font-weight:600;color:#a9d8ff;letter-spacing:.3px;
  padding:1.5px 8px;border-radius:999px;
  border:1px solid rgba(91,140,255,.3);background:rgba(91,140,255,.09);
}
.pi-route i{font-style:normal;color:var(--dim);font-size:10px}

.chart-card{display:flex;flex-direction:column}
.chart-wrap{position:relative;flex:1;padding:10px 14px 12px;display:flex;flex-direction:column}
.chart-now{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chart-now b{color:var(--text);font-size:13px}
/* SVG 绝对定位：其内在宽高比不得反向决定容器高度，否则会形成"越量越高"的回环 */
.chart-box{position:relative;flex:1;min-height:250px}
.chart-box svg{position:absolute;inset:0;display:block;width:100%;height:100%}
/* 趋势图：按容器真实像素绘制，双轴刻度 + 平滑曲线 + 未知区间底纹 */
.chart-grid{stroke:rgba(120,160,255,.1);stroke-width:1}
.chart-base{stroke:rgba(120,160,255,.24);stroke-width:1}
.chart-ylab{font-size:9.5px;fill:#5d7699;text-anchor:end}
.chart-ylab.r{text-anchor:start;fill:#8f7fd8}
.chart-xlab{font-size:9.5px;fill:#5d7699;text-anchor:middle}
.chart-axlab{font-size:9.5px;letter-spacing:.6px}
.chart-tick{stroke:rgba(120,160,255,.24);stroke-width:1}
.chart-pt{fill:#0a1122;stroke:#38c6ff;stroke-width:1.6}
.chart-pt-lat{fill:#0a1122;stroke:#9d7bff;stroke-width:1.6}
/* 悬停命中环：独立类名，避免与数据点标记混淆（数据点计数必须可判定） */
.chart-hit{fill:rgba(10,17,34,.55);stroke-width:2.2}
.chart-hit.l{stroke:#38c6ff}
.chart-hit.r{stroke:#9d7bff}
.chart-callout{font-size:10px;font-weight:700;letter-spacing:.3px;paint-order:stroke;stroke:rgba(10,17,34,.92);stroke-width:3px;stroke-linejoin:round}
.chart-unk{fill:url(#hUnk)}
.chart-unk-edge{stroke:rgba(132,146,168,.45);stroke-width:1;stroke-dasharray:3 3}
.chart-unk-label{font-size:9.5px;fill:#8492a8;letter-spacing:.6px;text-anchor:middle}
.chart-legend{display:flex;align-items:center;gap:13px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.chart-legend span{display:inline-flex;align-items:center;gap:5px}
.chart-legend i{width:15px;height:0;display:inline-block;border-top-width:2px;border-top-style:solid}
.chart-tip{
  display:none;position:absolute;z-index:6;pointer-events:none;
  font-size:10.5px;line-height:1.6;color:var(--text);
  background:rgba(8,14,28,.95);border:1px solid rgba(56,198,255,.35);
  border-radius:8px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.5);
  white-space:nowrap;
}
.chart-tip b{color:var(--cyan)}
.crosshair{stroke:rgba(56,198,255,.45);stroke-width:1;stroke-dasharray:3 3}

/* ==========================================================================
   10. 抽屉
   ========================================================================== */
.overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(4,8,18,.55);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:396px;max-width:92vw;z-index:70;
  background:linear-gradient(180deg,#0e1830,#0a1122);
  border-left:1px solid rgba(99,150,255,.22);
  box-shadow:-18px 0 50px rgba(0,0,0,.55);
  transform:translateX(105%);
  transition:transform .32s cubic-bezier(.22,.8,.3,1);
  overflow-y:auto;padding-bottom:20px;
}
.drawer.show{transform:translateX(0)}
.dw-bar{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 11px;border-bottom:1px solid rgba(99,150,255,.12)}
.dw-bar span{font-size:11.5px;color:var(--dim);letter-spacing:1.4px}
.dw-close{font-size:22px;line-height:1;color:var(--muted);padding:0 6px;transition:color .2s}
.dw-close:hover{color:var(--text)}
.dw-head{display:flex;align-items:center;gap:12px;padding:16px 18px 13px}
.dw-ic{
  width:50px;height:52px;flex:none;display:grid;place-items:center;border-radius:12px;
  background:rgba(56,198,255,.08);border:1px solid rgba(56,198,255,.3);color:#7fe8c4;
}
.dw-ic svg{width:32px;height:36px}
.dw-title{font-size:16px;font-weight:700;letter-spacing:.4px}
.dw-sub{font-size:11px;color:var(--dim);margin-top:3px}

/* ==========================================================================
   11. 悬浮说明 / Toast / 页脚
   ========================================================================== */
.tooltip{
  position:fixed;z-index:90;max-width:290px;pointer-events:none;
  font-size:11.5px;line-height:1.6;color:var(--text);
  padding:8px 12px;border-radius:9px;
  border:1px solid rgba(56,198,255,.4);
  background:rgba(8,14,28,.97);
  box-shadow:0 12px 32px rgba(0,0,0,.6);
  opacity:0;transform:translateY(4px);transition:opacity .16s,transform .16s;
}
.tooltip.show{opacity:1;transform:none}
.tooltip b{display:block;color:var(--cyan);font-size:11px;letter-spacing:.6px;margin-bottom:3px}
.toast{
  position:fixed;left:50%;bottom:30px;z-index:95;
  transform:translate(-50%,20px);
  font-size:12.5px;padding:9px 20px;border-radius:999px;
  border:1px solid rgba(56,198,255,.4);background:rgba(10,18,36,.96);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{
  padding:2px 20px 8px;font-size:10.5px;color:var(--dim);
  letter-spacing:.6px;text-align:center;
}

/* ==========================================================================
   12. 动画

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
/* 中断方向线闪烁：原始版 .edge.interrupted 用 svgBlink，重构为 .edge-path 时丢失，2026-09-22 补回

@keyframes svgBlink{0%,100%{opacity:1}50%{opacity:.28}}
@keyframes blinkBorder{0%,100%{box-shadow:0 0 6px rgba(255,95,95,.22)}50%{box-shadow:0 0 20px rgba(255,95,95,.55)}}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

body.paused *{animation-play-state:paused !important}

<body>

<!-- ======================= 顶栏 ======================= -->
<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 54" fill="none" aria-hidden="true">
      <defs><linearGradient id="lgLogo" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#38c6ff"/><stop offset="1" stop-color="#9d7bff"/>
      </linearGradient></defs>
      <path d="M24 3 L43 14 V40 L24 51 L5 40 V14 Z" stroke="url(#lgLogo)" stroke-width="2.4"/>
      <path d="M24 15 v10 l6 4 -6 9" stroke="#38c6ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div class="brand-txt">
      <h1>跨安全区链路通信监控</h1>
      <p>UNIT-CENTRIC LINK OBSERVABILITY · 单位视角大屏原型</p>
    </div>
  </div>

  <div class="tb-center">
    <div class="filters">
      <label class="field">单位 <select id="unit"></select></label>
      <label class="field">业务链路 <select id="path"></select></label>
      <label class="field">运行状态 <select id="status"></select></label>
      <button class="btn primary" id="query">查询</button>
      <button class="btn" id="reset">重置</button>
    </div>
  </div>

  <div class="tb-right">
    <button class="btn" id="refresh" title="立即刷新当前拓扑、指标与告警视图">↻ 立即刷新</button>
    <button class="btn" id="full" title="全屏 / 退出全屏">⛶ 全屏</button>
    <div class="clock">
      <div class="ct" id="clock">--:--:--</div>
      <div class="cd" id="date">--</div>
    </div>
  </div>
</header>

<main class="page">
  <!-- ======================= KPI（含单位概况状态卡，口径唯一） ======================= -->
  <section class="kpi-strip" id="kpis"></section>

  <!-- ======================= 拓扑 + 侧栏 ======================= -->
  <section class="main-grid">
    <section class="card topology-card">
      <!-- 卡头收纳「链路选择条 + 状态图例」：省掉卡内独立的 86px 选择条与 15px 图例行。
           线型说明（实线=下行 / 点线=上行）按 2026-09-22 要求移除常显，
           改为挂在链路条方向标签组上，悬浮/聚焦即可查看（见 laneHtml 的 data-tip="dir:rule"）。 -->
      <div class="card-head">
        <h2>当前单位链路拓扑</h2>
        <div class="topo-nav" id="topoNav" hidden aria-label="拓扑横向导航">
          <button id="topoPrev" type="button" aria-label="向左查看拓扑">‹</button>
          <button id="topoNext" type="button" aria-label="向右查看拓扑">›</button>
        </div>
        <!-- 链路选择暂时停用：拓扑默认同时展开全部链路。保留容器便于后续恢复。 -->
        <div class="lanes" id="lanes" hidden></div>
        <div class="legend">
          <span class="lg" tabindex="0" data-tip="legend:blocked"><i class="sw" style="background:var(--st-blocked)"></i>阻断源</span>
          <span class="lg" tabindex="0" data-tip="legend:impact"><i class="sw" style="background:var(--st-impact)"></i>上游中断</span>
          <span class="lg" tabindex="0" data-tip="legend:metric"><i class="sw" style="background:var(--st-metric)"></i>指标异常</span>
          <span class="lg" tabindex="0" data-tip="legend:unknown"><i class="sw" style="background:var(--st-unknown)"></i>未知</span>
        </div>
      </div>
      <div class="topo-scroll-note" id="topoScrollNote">在拓扑区域上下滑动查看完整链路</div>
      <div class="topo" id="topo">
        <div class="topo-canvas" id="topoCanvas">
          <!-- 深圳双链路行 × 分区列矩阵：层标签列 + 分区列 + 两组独立装置竖条 -->
          <div class="topo-grid" id="topoGrid"></div>
          <!-- 连线置于最末：须压在分区底色之上才可见 -->
          <svg class="edges" id="edges" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"></svg>
        </div>
      </div>
    </section>

    <aside class="side">
      <!-- 异常对象清单：全量口径，不随选中链路过滤；选中链路的条目高亮（见 .exception.is-sel） -->
      <section class="card">
        <div class="card-head">
          <h3 data-tip="exc:scope">异常对象清单</h3>
          <!-- 计数徽标：颜色由计数驱动（在 renderSide 中设置），不硬编码为告警色 -->
          <span class="chip" id="exceptionCount"></span>
        </div>
        <div class="list" id="exceptions"></div>
      </section>

      <!-- 实时告警：全量消息流，不随选中链路过滤；选中链路的条目高亮 -->
      <section class="card alarm-card">
        <div class="card-head">
          <h3 data-tip="alarm:scope">实时告警</h3>
          <span class="live" id="liveFlag"><i></i>实时</span>
        </div>
        <div class="afilter" id="afilter"></div>
        <div class="alarm-list" id="alarmList"></div>
      </section>
    </aside>

    <!-- ======================= 底栏（与拓扑卡同列；右侧栏跨两行） ======================= -->
    <section class="bottom-grid">
      <section class="card">
        <div class="card-head">
          <h3>业务链路</h3>
          <span class="right" data-tip="pathlist:scope">全部链路分组展示</span>
        </div>
        <div class="path-list" id="pathList"></div>
      </section>

      <section class="card chart-card">
        <div class="card-head">
          <h3>指标趋势</h3>
          <span class="right" id="chartTitle">—</span>
          <span class="chart-legend" id="chartLegend"></span>
          <span class="chip" id="chartStatus">—</span>
        </div>
        <div class="chart-wrap">
          <div class="chart-now" id="chartNow"></div>
          <div class="chart-box" id="chartBox">
            <svg id="chart" viewBox="0 0 600 180" preserveAspectRatio="none" role="img" aria-label="吞吐与时延趋势"></svg>
            <div class="chart-tip" id="chartTip"></div>
          </div>
        </div>
      </section>
    </section>
  </section>

  <footer>跨安全区链路通信监控原型 · 页面指标与告警均为本地模拟仿真（非真实生产数据），用于交互与视觉演示 · 不构成正式阈值或告警政策</footer>
</main>

<!-- ======================= 抽屉 / 浮层 ======================= -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="对象详情">
  <div class="dw-bar"><span>对象详情</span><button class="dw-close" id="close" aria-label="关闭">×</button></div>
  <div id="drawerBody"></div>
</aside>

<div class="tooltip" id="tooltip" role="tooltip"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ==========================================================================
   工具
   ========================================================================== */
const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const STATUS = {normal:'正常', abnormal:'异常', unknown:'未知', partialAbnormal:'部分异常', partialUnknown:'部分未知'};

/* ==========================================================================
   数据模型
   当前承载两条完全独立的深圳模拟链路：
      p-full 深圳Ⅳ区 ⇄ 安全接入区（c9 至 c4）
      p-file 深圳Ⅳ区 ⇄ 安全接入区（文件，c10 至 c5）
   两条链路各有 4 个业务节点、3 个隔离装置和 3 个分段，不复用 Node / Edge / 装置。
   拓扑为「深圳链路行 × 分区列」矩阵（5 行 × 10 列）：
     · 行 = 列标题 / 间隔 / 链路 1 / 间隔 / 链路 2；
    · 列 = 5 个分区列（安全接入区 / Ⅰ区 / Ⅱ区 / Ⅲ区 / Ⅳ区）
       + 4 个装置列（当前使用前 3 列）；
     · 两组隔离装置分行落在分区列的分界线上；
    · 两条独立链路均延伸至Ⅳ区，各自拥有独立节点与装置。
   交付件样例含一条异常链路：sg1 上行不通（仅 p-full 使用），
     故 p-full 异常、p-file 正常，用于演示红色断线、不通徽标与告警。
   指标与状态仍为本地固定样例，不构成正式阈值或告警政策。
   ========================================================================== */
const D = {
  units:[{id:'sz',name:'深圳',readonly:true}],
  objects:[{id:'comm',name:'跨区通信服务'},{id:'file',name:'跨区文件传输服务'}],

  /* 仅保留深圳层。层标签跨越两条独立链路行（row 3 / 5）。 */
  layers:[
    {id:'comm', name:'通信链路', row:'3 / 7'},
    {id:'file', name:'文件链路', row:'10 / 14'}
  ],
  /* 列 = 分区（顶部列标题）。col 为网格列号：
     1 层标签 · 2/4/6/8/10 分区（安全接入区 / Ⅰ区 / Ⅱ区 / Ⅲ区 / Ⅳ区）；

/* ==========================================================================
   状态
   ========================================================================== */
const S = {unit:'sz', path:'all', status:'all', selected:'p-full', focus:null, focusSeg:null};
const node = id => D.nodes.find(x => x.id === id);
const path = id => D.paths.find(x => x.id === id);
const segment = id => D.segments.find(x => x.id === id);
/* 一条完整链路的状态由其全部分段的方向状态聚合：任一方向不通即为异常 */
/* 该链路拥有的分段：按段的 paths 归属直取。
   公共段列多条链路，故同一段会同时出现在多个 segsOf 结果里 —— 拓扑上仍只画一次。 */
const segsOf = p => D.segments.filter(s => (s.paths || []).includes(p.id));
/* 链路方向状态：实线 = 下行，点线 = 上行；颜色只从 --st-* 语义色取，不新增颜色 */
const DIR_STATE = {
  normal:      {cn:'通畅', css:'var(--st-normal)'},
  abnormal:    {cn:'异常', css:'var(--st-metric)'},
  interrupted: {cn:'不通', css:'var(--st-blocked)'},
  /* 受阻：该方向自身未故障，但因上游阻断收不到数据 —— 即图例中的「上游中断」语义 */
  impact:      {cn:'受阻', css:'var(--st-impact)'},
  unknown:     {cn:'未知', css:'var(--st-unknown)'}
};
/* 节点所属分区简称：网级层统一为「网级」，其余取分区列名 */
const zoneOf = id => {
  const n = node(id);
  if (!n) return id;
  if (n.layer === 'net') return '网级';
  return zoneName(n.zone) || ((n.loc || '').split('·')[0].trim()) || id;
};
/* 单个分段的状态：由其两个方向聚合（异常优先于未知） */
const segStatus = s => (s.down === 'interrupted' || s.up === 'interrupted') ? 'abnormal'
  : (s.down === 'abnormal' || s.up === 'abnormal') ? 'partialAbnormal'
  : (s.down === 'unknown' && s.up === 'unknown') ? 'unknown'
  : (s.down === 'unknown' || s.up === 'unknown') ? 'partialUnknown'
  : 'normal';
const DIR_CN = k => (DIR_STATE[k] || DIR_STATE.unknown).cn;
const DIR_CSS = k => (DIR_STATE[k] || DIR_STATE.unknown).css;
/* 分段的分区对标签：同区为「X 内」，跨区为「X ⇄ Y」。
   异常对象清单与业务链路卡共用本函数，避免两处各写一份。 */
const segPair = sg => {
  const za = zoneOf(sg.a), zb = zoneOf(sg.b);
  return za === zb ? za + ' 内' : za + ' ⇄ ' + zb;
};
/* 归属高亮/降噪（异常清单与实时告警共用）：
   条目属于当前选中链路 → is-sel；否则降噪 dim。
   **严重条目始终全亮**——降噪可以，但不能把故障淡到看不见。 */
/* 链路选择暂停期间不降噪其他 Path 的清单/告警；仅为当前趋势上下文保留轻量归属高亮。 */
const ownCls = e => (e.paths || []).includes(S.selected) ? ' is-sel' : '';

/* 分段聚焦（2026-09-22）：点「业务链路」里的分段条目时，把该段作为一个整体高亮——
   两端节点 + 经过的装置 + 该段连线，其余节点与连线降噪。
   与 S.focus（单节点聚焦，抽屉用）互不干扰：进入分段聚焦时清空 S.focus。 */
const focusSegOf = () => (S.focusSeg ? segment(S.focusSeg) : null);
const inFocusSeg = id => {
  const s = focusSegOf();
  return !!s && (s.a === id || s.via === id || s.b === id);
};
/* 默认同时展示全部链路：只在分段聚焦时降噪，不再因「未选中链路」降低透明度。 */
const ownDim = id => focusSegOf() ? !inFocusSeg(id) : false;

/* 完整链路状态由其全部分段的方向状态聚合得到（异常优先于未知），
   避免「方向状态」与「链路状态」两处各写一份而互相矛盾 */
function derivePathStatus() {
  D.paths.forEach(p => {
    const ds = [];
    segsOf(p).forEach(s => { ds.push(s.down, s.up); });
    if (!ds.length) return;
    p.blocked = ds.some(s => s === 'interrupted');
    p.status = p.blocked ? 'abnormal'
      : ds.some(s => s === 'abnormal') ? 'partialAbnormal'
      : ds.every(s => s === 'unknown') ? 'unknown'
      : ds.some(s => s === 'unknown') ? 'partialUnknown'
      : 'normal';
  });
}
derivePathStatus();

/* 某条链路上「因上游阻断而受阻」的方向集合。
   分段按 route 排出下行序（网级 → 安全接入区）；下行链正序走一遍、
   上行链反序走一遍，某方向一旦出现 interrupted，其后的同方向段全部受阻。
   受阻 ≠ 不通：那几段自身并未故障，只是收不到数据（对应图例的「上游中断」）。 */
function starvedDirs(p) {
  if (!p) return {down: new Set(), up: new Set()};
  const segs = segsOf(p).slice().sort((x, y) => p.route.indexOf(x.b) - p.route.indexOf(y.b));
  const out = {down: new Set(), up: new Set()};
  ['down','up'].forEach(kind => {
    const order = kind === 'down' ? segs : segs.slice().reverse();
    let broken = false;
    order.forEach(sg => {
      if (broken) out[kind].add(sg.id);
      if (sg[kind] === 'interrupted') broken = true;
    });
  });
  return out;
}

/* 由分段方向状态**派生**节点 flow，避免 flow 与 segments 成为两个事实源
   （原先把 12 个节点全部硬编码为 flow:'normal'，于是「阻断链路=1」而
   「自身异常节点=0」，页面自相矛盾；.node.is-impact 样式与「上游中断」图例项
   也因样例从未触发而形同虚设）。
   规则：只有故障源装置标记 blocked（无装置时取故障分段端点）；
        后续链路的受阻状态只画在线上，不把沿途业务节点或装置标为异常。 */
function deriveFlows() {
  D.nodes.forEach(n => { n.flow = 'normal'; });
  const blocked = new Set();
  D.paths.forEach(p => {
    segsOf(p).forEach(sg => {
      if (sg.down === 'interrupted' || sg.up === 'interrupted') blocked.add(sg.via || sg.a);
    });
  });
  blocked.forEach(id => { const n = node(id); if (n) n.flow = 'blocked'; });
}
deriveFlows();

const chip = (s, tipKey) =>
  '<span class="chip ' + s + '" data-tip="' + (tipKey || ('path:' + s)) + '">' + STATUS[s] + '</span>';

/* ==========================================================================
   悬浮说明（需求 2）
   ========================================================================== */
const tipEl = $('#tooltip');
function showTip(key, anchor) {
  const txt = TIPS[key];
  if (!txt) return;
  const i = txt.indexOf('：');
  tipEl.innerHTML = (i > 0 ? '<b>' + txt.slice(0, i) + '</b>' : '') + (i > 0 ? txt.slice(i + 1) : txt);
  tipEl.classList.add('show');
  const r = anchor.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let left = Math.min(Math.max(8, r.left + r.width / 2 - t.width / 2), window.innerWidth - t.width - 8);
  let top = r.top - t.height - 9;
  if (top < 8) top = r.bottom + 9;
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}
const hideTip = () => tipEl.classList.remove('show');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tip]');
  if (el) showTip(el.dataset.tip, el); else hideTip();
});
document.addEventListener('focusin', e => {
  const el = e.target.closest('[data-tip]');
  if (el) showTip(el.dataset.tip, el);
});
document.addEventListener('focusout', hideTip);
window.addEventListener('scroll', hideTip, true);

/* ==========================================================================

function overview() {
  const ps = D.paths.filter(p => p.unit === S.unit);
  const blocked = ps.filter(p => p.blocked).length;
  const bad = ps.filter(p => ['abnormal','partialAbnormal'].includes(p.status)).length;
  const unk = ps.filter(p => ['unknown','partialUnknown'].includes(p.status)).length;
  if (!ps.length) return {label:'暂无运行链路', cls:'unknown', detail:'当前单位没有已发布且启用 Path。', ps, blocked, bad, unk};
  if (blocked)    return {label:'存在中断', cls:'abnormal', detail:blocked + ' 条 Path 存在数据流转阻断。', ps, blocked, bad, unk};
  if (bad)        return {label:'存在异常', cls:'abnormal', detail:bad + ' 条 Path 存在异常或部分异常。', ps, blocked, bad, unk};
  if (unk)        return {label:'存在未知', cls:'unknown',  detail:unk + ' 条 Path 存在未知或部分未知对象。', ps, blocked, bad, unk};
  return {label:'运行正常', cls:'normal', detail:'全部 Path 状态正常。', ps, blocked, bad, unk};
}
function match(p) {
  return p.unit === S.unit
    && (S.path === 'all' || p.id === S.path)
    && (S.status === 'all'
      || (S.status === 'abnormal' && ['abnormal','partialAbnormal'].includes(p.status))
      || (S.status === 'unknown'  && ['unknown','partialUnknown'].includes(p.status))
      || (S.status === 'normal'   && p.status === 'normal'));
}

}

/* ==========================================================================
   渲染：状态横幅 + KPI
   ========================================================================== */
function renderTop() {
  const o = overview();
  /* 首卡「当前单位概况」保留原样；其余三张为指标卡（2026-09-22 改版）：
     平均时延 / 链路吞吐量 / 今日告警。原「业务链路 / 阻断链路 / 自身异常节点 /
     受上游影响节点」四卡已移除——其中「业务链路」「阻断」两个数仍在首卡副文案里，
     故口径未丢；节点级状态口径（故障源 / 上游中断）改由拓扑与异常清单承载。 */
  /* 统一按 o.ps（当前单位的已发布启用 Path）取值，与首卡副文案同口径，
     避免将来放开单位查询后同行各卡口径不一致 */
  const lats = o.ps.map(p => Number(p.metrics && p.metrics.lat)).filter(Number.isFinite);
  const latAvg = lats.length ? lats.reduce((a, b) => a + b, 0) / lats.length : null;
  const latMax = lats.length ? Math.max.apply(null, lats) : null;
  const bps = o.ps.map(p => Number(p.metrics && p.metrics.bps)).filter(Number.isFinite);
  const bpsSum = bps.length ? bps.reduce((a, b) => a + b, 0) : null;
  /* 峰值 = 各链路历史吞吐峰值之和；无 history 的链路以当前值兜底 */
  const peaks = o.ps.map(p => {
    const hs = (p.history || []).map(h => Number(h[1])).filter(Number.isFinite);
    return hs.length ? Math.max.apply(null, hs) : Number(p.metrics && p.metrics.bps);
  }).filter(Number.isFinite);
  const bpsPeak = peaks.length ? peaks.reduce((a, b) => a + b, 0) : null;
  const unhandled = alarms.filter(a => a.state === '未处置').length;
  /* 原「状态横幅 + 统计口径」整行已删除，其内容并入首卡，单位口径只在此处出现一次 */
  const sub = o.ps.length
    ? '深圳 · ' + o.ps.length + ' 业务链路 · ' + o.blocked + ' 阻断 · ' + o.bad + ' 异常 · ' + o.unk + ' 未知'
    : '深圳 · 当前单位没有已发布且启用 Path';
  $('#kpis').innerHTML =

    /* 未知一律用 —，不以 0 替代（与图例「未知」项一致） */
    kpi('平均时延', latAvg == null ? '—' : latAvg.toFixed(1) + '<span class="unit"> ms</span>',
      latAvg == null ? '暂无数据' : '最高 ' + latMax.toFixed(1) + ' ms', '', '', 'kpi:lat') +
    kpi('链路吞吐量', bpsSum == null ? '—' : bpsSum + '<span class="unit"> Mbps</span>',
      bpsSum == null ? '暂无数据' : '峰值 ' + bpsPeak + ' Mbps', '', '', 'kpi:bps') +
    kpi('今日告警', alarmTodayTotal, '未处置 ' + unhandled + ' 条',
      unhandled ? 'danger' : '', '', 'kpi:alarm');
}
function kpi(label, value, sub, cls, extra, tip) {
  /* 首卡的值是「状态」而非「计数」：用状态胶囊承载，与其余卡 19px 数值在形态上区分开
     （原先把「存在中断」按 19px 粗体渲染，与数字混在一起显得过大、不协调）。
     tip 为悬浮口径说明的注册键；extra 只负责「是不是状态卡」，两者解耦。 */
  const val = extra === 'status'
    ? '<span class="kpi-chip ' + (cls || '') + '">' + value + '</span>'
    : '<span class="kpi-value">' + value + '</span>';
  return '<div class="kpi ' + (cls || '') + (extra ? ' ' + extra : '') + '"' +
    (tip ? ' data-tip="' + tip + '"' : '') + '>' +
    '<div class="kpi-row"><span class="kpi-label"><i></i>' + label + '</span>' + val + '</div>' +
    '<div class="kpi-sub">' + sub + '</div></div>';

/* 全链方向状态：把各分段的方向状态聚合为一档（任一不通即不通，任一异常即异常） */
function aggDir(p, k) {
  const ds = segsOf(p).map(s => s[k]);
  if (!ds.length) return 'unknown';
  if (ds.some(s => s === 'interrupted')) return 'interrupted';
  if (ds.some(s => s === 'abnormal')) return 'abnormal';
  if (ds.every(s => s === 'unknown')) return 'unknown';
  return 'normal';
}
function laneHtml(p) {

  const segs = segsOf(p);
  const n = segs.length, devN = segs.filter(x => x.via).length;
  const dirs = ['down','up'].map(k => {
    const st = aggDir(p, k);
    return '<span class="dirs" data-tip="dir:' + st + '" style="color:' + DIR_CSS(st) + '">' + dirLine(k, 18) +
      (k === 'down' ? '下行' : '上行') + DIR_CN(st) + '</span>';
  }).join('');
  /* 线型说明（实线=下行 / 点线=上行）改挂在这一组方向标签上：常显图例已按 2026-09-22 要求移除 */

function renderTopology() {
  /* 链路选择暂时停用；拓扑同时展开 D.paths 全部链路。 */
  // $('#lanes').innerHTML = D.paths.map(laneHtml).join('');
  $('#lanes').innerHTML = '';

  /* 两条链路分块纵向展开；文件链路重复列标题，避免滚动后失去区域上下文。 */
  const bg = '';
  const heads = D.zones.map(zoneHeadHtml).join('') +
    D.zones.filter(z => z.id !== 'z1a').map(z => zoneHeadHtml({...z,id:z.id+'-file',row:8})).join('') +
    zoneHeadHtml({...D.zones.find(z => z.id === 'z1a'),id:'z1a-file',row:12});
  const labels = D.layers.map(layerLabelHtml).join('');
  /* 单层深圳拓扑不再需要网级/深圳横向分割线 */
  const divider = '<div class="access-boundary" style="grid-column:2 / 9;grid-row:4" aria-hidden="true"></div>' +
    '<div class="lane-separator" style="grid-column:2 / 9;grid-row:7" aria-hidden="true"></div>' +
    '<div class="access-boundary" style="grid-column:2 / 9;grid-row:11" aria-hidden="true"></div>';
  /* 分区边界仅覆盖本链路的横向段，不穿过下方安全接入区。 */
  const bounds = [...new Set(D.bars.map(b => b.col))].flatMap(col => [
    '<div class="boundary-line" style="grid-column:' + col + ';grid-row:1 / 4" aria-hidden="true"></div>',
    '<div class="boundary-line" style="grid-column:' + col + ';grid-row:8 / 11" aria-hidden="true"></div>'
  ]).join('');
  /* 纵向隔离装置分别属于通信、文件两条链路。 */
  const bands = (D.bands || []).map(bandHtml).join('');

  /* 装置竖条：跨在相邻两列之间；同一位置的多个装置合并到一个单元格里纵向排列，
     使「第 N 根竖条」与相邻列的「第 N 张卡」横向对齐 */
  const barGroups = {};
  D.bars.forEach(x => {
    const k = x.col + '@' + x.row;
    (barGroups[k] = barGroups[k] || {col: x.col, row: x.row, ids: []}).ids.push(x.id);
  });
  const bars = Object.keys(barGroups).map(k => {
    const g = barGroups[k];
    return '<div class="bar-cell" style="grid-column:' + g.col + ';grid-row:' + g.row + '">' +
      g.ids.map(id => barHtml(node(id))).join('') + '</div>';
  }).join('');

  /* 节点单元格：按 (列, 行) 聚合；装置竖条已单独渲染，此处跳过 */
  const barIds = D.bars.map(b => b.id).concat((D.bands || []).map(b => b.id));
  const groups = {};
  D.nodes.forEach(n => {
    if (barIds.includes(n.id)) return;
    const k = colOf(n) + '@' + rowOf(n);
    (groups[k] = groups[k] || {col: colOf(n), row: rowOf(n), ns: []}).ns.push(n);
  });
  const cells = Object.keys(groups).map(k => groups[k])
    .sort((a, b) => a.row - b.row || a.col - b.col)
    .map(g => cellHtml(g.col, g.row, g.ns)).join('');

  $('#topoGrid').innerHTML = bg + heads + labels + divider + bounds + bars + bands + cells;
  drawEdges();
  requestAnimationFrame(() => {
    updateTopoNav();
  });
}
