  $('#topoScrollNote').style.display = (overflow || vertical) ? '' : 'none';
  $('#topoScrollNote').textContent = overflow && vertical ? '上下或左右滑动查看完整拓扑'
    : vertical ? '在拓扑区域上下滑动查看完整链路' : '左右滑动查看完整拓扑';
  $('#topoPrev').disabled = !overflow || topo.scrollLeft < 2;
  $('#topoNext').disabled = !overflow || topo.scrollLeft >= topo.scrollWidth - topo.clientWidth - 8;
}

/* --------------------------------------------------------------------------
   连接线：正交折线 + 圆角 + 渐变描边 + 流动粒子
   -------------------------------------------------------------------------- */
function polyPath(pts, r) {
  if (pts.length < 2) return '';
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const d1 = Math.hypot(x1 - x0, y1 - y0) || 1, d2 = Math.hypot(x2 - x1, y2 - y1) || 1;
    const rr = Math.min(r, d1 / 2, d2 / 2);
    const ax = x1 - (x1 - x0) / d1 * rr, ay = y1 - (y1 - y0) / d1 * rr;
    const bx = x1 + (x2 - x1) / d2 * rr, by = y1 + (y2 - y1) / d2 * rr;
    d += ' L' + ax.toFixed(1) + ' ' + ay.toFixed(1) +
         ' Q' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' ' + bx.toFixed(1) + ' ' + by.toFixed(1);
  }
  const last = pts[pts.length - 1];
  return d + ' L' + last[0].toFixed(1) + ' ' + last[1].toFixed(1);
}
const EDGE_MARKERS = {
  normal:'#ar-normal', abnormal:'#ar-abnormal', interrupted:'#ar-fault',
  impact:'#ar-impact', unknown:'#ar-unknown'
};
const EDGE_STROKE = {
  normal:'#2ee6a8', abnormal:'#ffb648', interrupted:'#ff5f5f',
  impact:'#af6977', unknown:'#8492a8'
};
function drawEdges() {
  const canvas = $('#topoCanvas'), svg = $('#edges');
  const cr = canvas.getBoundingClientRect();
  /* 4K 模式 body 使用 CSS zoom；DOMRect 为屏幕像素，SVG viewBox 为布局像素。 */
  const scaleX = cr.width / canvas.offsetWidth || 1;
  const scaleY = cr.height / canvas.offsetHeight || 1;
  /* 先把 SVG 收为零尺寸再量取内容宽高：SVG 是绝对定位子元素，
     若直接读 scrollWidth 会把上一轮按旧尺寸设置的 SVG 宽度算进去，
     形成"容器越量越宽、SVG 永不收缩"的回环。 */
  svg.style.width = '0px';
  svg.style.height = '0px';
  const W = Math.max(canvas.clientWidth, canvas.scrollWidth);
  const H = Math.max(canvas.clientHeight, canvas.scrollHeight);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.style.width = W + 'px';
  svg.style.height = H + 'px';

  const box = id => {
    const el = $('#n-' + id);
    if (!el) return null;
    const r = el.getBoundingClientRect();
    return {
      l: (r.left - cr.left) / scaleX, t: (r.top - cr.top) / scaleY,
      w: r.width / scaleX, h: r.height / scaleY,
      r: (r.right - cr.left) / scaleX, b: (r.bottom - cr.top) / scaleY,
      cx: (r.left - cr.left + r.width / 2) / scaleX,
      cy: (r.top - cr.top + r.height / 2) / scaleY
    };
  };

  let defs = '<defs>';
  /* 关键：折线多为纯水平/垂直段，包围盒宽度或高度为 0；
     若用默认的 objectBoundingBox 渐变单位，Chrome 不会描边。
     因此统一使用 userSpaceOnUse，以画布尺寸定义渐变。 */
  const grad = (id, c1, c2, c3) =>
    '<linearGradient id="' + id + '" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="' + W + '" y2="' + H + '">' +
    '<stop offset="0" stop-color="' + c1 + '" stop-opacity=".4"/>' +
    '<stop offset=".5" stop-color="' + c2 + '"/>' +
    '<stop offset="1" stop-color="' + c3 + '" stop-opacity=".6"/></linearGradient>';
  defs += grad('g-normal', '#2ee6a8', '#2ee6a8', '#38c6ff');
  defs += grad('g-abnormal', '#ffb648', '#ffd08a', '#ffb648');
  defs += grad('g-unknown', '#8492a8', '#8492a8', '#8492a8');
  defs += grad('g-fault', '#ff5f5f', '#ff5f5f', '#ff9a9a');
  defs += grad('g-impact', '#af6977', '#c98b98', '#af6977');
  Object.keys(EDGE_MARKERS).forEach(k => {
    defs += '<marker id="' + EDGE_MARKERS[k].slice(1) + '" viewBox="0 0 8 8" refX="6.6" refY="4" ' +
      'markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse">' +
      '<path d="M0,0 L8,4 L0,8 Z" fill="' + EDGE_STROKE[k] + '"/></marker>';
  });
  defs += '</defs>';

  let out = defs;
  /* 每段链路画两条平行方向线：实线 = 下行，点线 = 上行；
     每段经一处装置转发，故拆成「上游端 ⇄ 装置」「装置 ⇄ 下游端」两跳，
     两跳共用同一对平行偏移，视觉上形成一条穿过装置的双线。 */
  const OFF = 6;
  /* 分段聚焦：该段连线保持高亮，同链路其余段降噪 */
  const fSeg = focusSegOf();

  /* 一跳的连线点位：up = 上游端（靠网级），down = 下游端（靠安全接入区）；
     kind 决定平行偏移（下行偏上/偏左，上行偏下/偏右） */
  const hopPts = (down, up, kind, axis, off) => {
    const s = off == null ? (kind === 'down' ? -OFF : OFF) : off;
    if (axis === 'v') {
      const p0 = {x: up.cx + s, y: up.b}, p1 = {x: down.cx + s, y: down.t};
      if (Math.abs(p0.x - p1.x) < 6) return [[p0.x, p0.y], [p1.x, p1.y]];
      const my = (p0.y + p1.y) / 2;
      return [[p0.x, p0.y], [p0.x, my], [p1.x, my], [p1.x, p1.y]];
    }
    const p0 = {x: up.l, y: up.cy + s}, p1 = {x: down.r, y: down.cy + s};
    if (Math.abs(p0.y - p1.y) < 6) return [[p0.x, p0.y], [p1.x, p1.y]];
    const mx = (p0.x + p1.x) / 2;
    return [[p0.x, p0.y], [mx, p0.y], [mx, p1.y], [p1.x, p1.y]];
  };

  /* 未选中链路每跳只画 1 条细线，状态取分段聚合值；
     partialX 不在 EDGE_MARKERS 里，须映射到 X，否则 marker-end 会取到 undefined */
  const soloState = st => st === 'partialAbnormal' ? 'abnormal' : st === 'partialUnknown' ? 'unknown' : st;

  D.segments.forEach((sg, i) => {
    const A = box(sg.a), B = box(sg.b);
    if (!A || !B) return;
    /* via 为 null 表示两端直连（三区内上行/下行之间），此时只有一跳 */
    const V = sg.via ? box(sg.via) : null;
    if (sg.via && !V) return;
    const owner = path((sg.paths || [])[0]);
    const starved = starvedDirs(owner);

    /* 经装置时拆两跳：上游端 ⇄ 装置、装置 ⇄ 下游端（a 为下游端，下行箭头指向它）；
       直连段只有一跳 */
    (V ? [[A, V], [V, B]] : [[A, B]]).forEach(([down, up], hi) => {
      const kinds = ['down','up'];
      kinds.forEach(kind => {
        /* 受阻优先于自身状态：该方向自身通畅，只是上游断了（用「上游中断」色，不闪烁） */
        const st = starved[kind].has(sg.id) ? 'impact' : sg[kind];
        const pts = hopPts(down, up, kind, sg.axis, null);
        /* 下行由上游指向下游，上行方向相反 */
        const seq = kind === 'down' ? pts : pts.slice().reverse();
        const id = 'ep' + i + '-' + hi + '-' + kind;
        const cls = 'edge-path ' + st + (kind === 'up' ? ' up' : '') +
          (fSeg ? (fSeg.id === sg.id ? ' hi' : ' dim') : ' hi');
        out += '<path id="' + id + '" class="' + cls + '" d="' + polyPath(seq, 8) +
          '" marker-end="url(' + EDGE_MARKERS[st] + ')"/>';

        /* 流动粒子：全部链路同时展示；该方向未中断且未受阻时绘制，
           且处于分段聚焦时只给被聚焦的那一段 */
        if (st !== 'interrupted' && st !== 'impact' && (!fSeg || fSeg.id === sg.id)) {
          const dur = st === 'abnormal' ? 3.4 : 2.4;
          for (let k = 0; k < 2; k++) {
            out += '<circle class="flow-dot" r="2.6">' +
              '<animateMotion dur="' + dur + 's" repeatCount="indefinite" begin="' + (k * dur / 2) + 's">' +
              '<mpath xlink:href="#' + id + '" href="#' + id + '"/></animateMotion></circle>';
          }
        }
      });
    });

    /* 不通：在装置处（直连段则在本段中点）标注「方向不通」，避免只看颜色判断 */
    ['down','up'].forEach(kind => {
      if (sg[kind] !== 'interrupted') return;
      const anchor = V ? {x: V.cx, y: V.t - 12}
                       : {x: (A.cx + B.cx) / 2, y: Math.min(A.t, B.t) - 12};
      out += '<g transform="translate(' + anchor.x.toFixed(1) + ',' + anchor.y.toFixed(1) + ')"' +
        ' opacity="1">' +
        '<rect class="edge-badge" x="-32" y="-9" width="64" height="18" rx="9"/>' +
        '<text class="edge-badge-txt" x="0" y="3.5" text-anchor="middle">' +
        (kind === 'down' ? '下行' : '上行') + '不通</text></g>';
    });
  });
  svg.innerHTML = out;

  /* 窄屏时拓扑需横向滚动，给出可发现的提示 */
  const topo = $('#topo');
}

/* ==========================================================================
   渲染：异常清单 + 实时告警（需求 3）
   ========================================================================== */
let alarmSeq = 0;
let alarms = [];
/* 「今日告警」KPI 用：自本次打开页面以来的累计推送条数。
   必须独立于 alarms.length —— 队列有 40 条上限（见 pushAlarm），直接数队列会在 40 条后冻结。
   只在 pushAlarm 内自增；seedAlarms 末尾按其产出条数赋值。页面刷新即从 0 重新累计
   （原型不建模日期翻转，「今日」是名义口径）。 */
let alarmTodayTotal = 0;
let sevFilter = 'all';
/* 异常对象清单的当前渲染集：条目以 data-exc="<索引>" 回查本数组，
   避免依赖「重算一次必然同序」这一隐含假设 */
let excPool = [];
const SEV_CN = {critical:'严重', warn:'警告', info:'提示'};

function srcOf(e) {
  const n = node(e.node), p = path(e.path);
  return (n ? n.name : '—') + (p ? ' · ' + p.name : '');
}
function seedAlarms() {
  alarms = D.events.map(e => ({
    id: ++alarmSeq,
    /* 事件严重度 unknown 归入告警「提示」档，保证筛选计数自洽 */
    sev: e.sev === 'unknown' ? 'info' : e.sev,
    time: e.time,
    ts: null,
    src: srcOf(e),
    msg: e.detail,
    state: e.sev === 'critical' ? '未处置' : e.sev === 'warn' ? '处理中' : '已恢复',
    node: e.node,
    path: e.path,
    paths: e.path ? [e.path] : []
  }));
  /* 首屏补种的告警也要计入「今日累计」（当前 D.events 为空 → 0，属正确的真值） */
  alarmTodayTotal = alarms.length;
}
/* 由既有对象状态派生「异常对象池」，不新增业务规则。
   口径（2026-09-22 裁决）：Edge（分段方向）与 Node 同样是「对象」——
   基线 §9.2「Path 当前状态聚合该 Path 所包含的全部 Node 和 Edge 状态」，
   故链路方向异常/不通一并进入「异常对象清单」。
   分工：异常对象清单 = 对象汇总；实时告警 = 消息流。两者同源于本函数，不两处各写一份。 */
const SEV_RANK = {critical:3, warn:2, unknown:1};
function abnormalObjects() {
  const out = [];
  /* ① 分段方向（Edge）：一个方向一条 */
  D.segments.forEach(sg => {
    const ps = (sg.paths || []).map(path).filter(Boolean);
    const dev = node(sg.via);
    const names = ps.map(p => p.name).join(' / ');
    ['down','up'].forEach(k => {
      const st = sg[k];
      if (st === 'normal') return;
      const cn = k === 'down' ? '下行' : '上行';
      const hop = dev ? '（经 ' + dev.name + '）' : '';
      out.push({
        kind:'edge',
        sev: st === 'interrupted' ? 'critical' : st === 'abnormal' ? 'warn' : 'unknown',
        title: segPair(sg) + ' · ' + cn + '方向',
        time: (ps[0] && ps[0].updated) || '',
        detail: cn + '方向' + (st === 'interrupted' ? '不通，数据无法转发'
              : st === 'abnormal' ? '指标越界，当前未中断' : '状态未知') + hop + '。',
        impact: names ? '归属：' + names : '归属：—',
        src: (names || sg.id) + ' · ' + cn + '方向' + hop,
        tip: 'dir:' + st, node: sg.a, path: ps[0] && ps[0].id,
        paths: ps.map(p => p.id)
      });
    });
  });
  /* ② 业务/装置/网级节点：主状态非正常，或带「指标异常」角标 */
  D.nodes.forEach(n => {
    /* 一个节点可能同属多条链路（公共节点），文案须列出全部，只报首条会误导 */
    const ps = D.paths.filter(x => x.route.includes(n.id));
    const names = ps.map(p => p.name).join(' / ');
    const many = ps.length > 1 ? '（' + ps.length + ' 条链路）' : '';
    let sev = null, detail = '', tip = '';
    if (n.status === 'abnormal') {
      sev = 'critical'; tip = 'flow:blocked';
      detail = n.name + ' 服务进程异常，数据流转受阻。';
    } else if (n.metric) {
      sev = 'warn'; tip = 'flow:metric';
      detail = n.name + ' 指标越界：' + Object.entries(n.m).map(([k, v]) => k + ' ' + v).join('、') + '。';
    } else if (n.status === 'unknown') {
      sev = 'unknown'; tip = 'flow:unknown';
      detail = n.name + ' 探针数据已过期，当前状态未知。';
    }
    if (!sev) return;
    out.push({
      kind:'node', sev, title:n.name, time:n.updated || '', detail,
      impact: names ? '归属：' + names + many : '归属：—',
      src: n.name + (names ? ' · ' + names : '') + many,
      tip, node:n.id, path: ps[0] && ps[0].id, paths: ps.map(p => p.id)
    });
  });
  /* ③ 显式事件样例（D.events）：保留为可人工注入的事件源 */
  D.events.forEach(e => out.push({
    kind:'event', sev: e.sev === 'unknown' ? 'unknown' : e.sev,
    title:e.title, time:e.time, detail:e.detail, impact:e.impact,
    src: srcOf(e), tip:null, node:e.node, path:e.path,
    paths: e.path ? [e.path] : []
  }));
  return out.sort((a, b) => (SEV_RANK[b.sev] || 0) - (SEV_RANK[a.sev] || 0));
}

/* 实时告警的候选池：异常对象 + 正常对象的「周期上报正常」填充项（后者不进入异常清单） */
function deriveAlarm() {
  const pool = abnormalObjects().map(e => ({
    /* 事件严重度 unknown 归入告警「提示」档，保证筛选计数自洽 */
    sev: e.sev === 'unknown' ? 'info' : e.sev,
    src: e.src,
    msg: e.detail,
    state: e.sev === 'critical' ? '未处置' : e.sev === 'warn' ? '处理中' : '待确认',
    node: e.node, path: e.path, paths: e.paths || (e.path ? [e.path] : [])
  }));
  D.nodes.forEach(n => {
    if (n.status !== 'normal' || n.metric) return;
    const ps = D.paths.filter(x => x.route.includes(n.id));
    const names = ps.map(p => p.name).join(' / ');
    const tag = ps.length > 1 ? '（' + ps.length + ' 条链路）' : '';
    pool.push({sev:'info', src:n.name + (names ? ' · ' + names : ''),
      msg:n.name + ' 周期上报正常。' + tag, state:'已恢复', node:n.id, path:ps[0] && ps[0].id,
      paths: ps.map(p => p.id)});
  });
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}
function pushAlarm(a) {
  const d = new Date();
  a.id = ++alarmSeq;
  a.ts = d.getTime();
  a.time = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  alarms.unshift(a);
  if (alarms.length > 40) alarms.pop();
  /* 累计计数在 pop 之外自增：队列截断不回退计数，「今日告警」不会在 40 条后冻结 */
  alarmTodayTotal++;
  renderAlarms();
  renderTop();   /* 让「今日告警」卡即时刷新，不必等下一次 render() */
}
function renderAlarms() {
  /* 实时告警是全量消息流，不随选中链路过滤；属于当前选中链路的条目高亮，其余降噪 */
  const list = alarms.filter(a => sevFilter === 'all' || a.sev === sevFilter);
  $('#alarmList').innerHTML = list.length ? list.map(a =>
    '<div class="alarm-item sev-' + a.sev + ownCls(a) + '" data-own="' + (a.paths || []).join(',') + '">' +
      '<div class="alarm-top">' +
        '<span class="sev-chip ' + a.sev + '">' + SEV_CN[a.sev] + '</span>' +
        '<span class="alarm-time">' + a.time + '</span>' +
        '<span class="alarm-state' + (a.state === '未处置' ? ' open' : '') + '">' + a.state + '</span>' +
      '</div>' +
      '<div class="alarm-src">' + a.src + '</div>' +
      '<div class="alarm-msg">' + a.msg + '</div>' +
    '</div>').join('') : '<div class="alarm-empty">当前筛选下暂无告警</div>';

  const cnt = k => k === 'all' ? alarms.length : alarms.filter(a => a.sev === k).length;
  $('#afilter').innerHTML = ['all','critical','warn','info'].map(k =>
    '<button class="fchip' + (sevFilter === k ? ' on' : '') + '" data-sev="' + k + '">' +
    (k === 'all' ? '全部' : SEV_CN[k]) + '<i>' + cnt(k) + '</i></button>').join('');
}
function setLive(on) {
  const el = $('#liveFlag');
  el.className = 'live' + (on ? '' : ' off');
  el.innerHTML = '<i></i>' + (on ? '实时' : '已暂停');
}

/* 由既有 route 派生分区序列条。 */
function routeStrip(p) {
  const rs = [];
  p.route.forEach(id => {
    if (id === 'net') { if (rs[rs.length - 1] !== '网级') rs.push('网级'); return; }
    const n = node(id);
    if (!n || n.kind === 'device') return;      /* 装置不参与分区序列 */
    const r = (n.loc || '').split('·')[0].trim();
    if (!r) return;
    if (rs[rs.length - 1] !== r) rs.push(r);
  });
  return '<span class="pi-route">' +
    rs.map((z, i) => (i ? '<i>›</i>' : '') + '<b>' + z + '</b>').join('') + '</span>';
}

function renderSide() {
  /* 异常对象清单：数据源为 abnormalObjects()（Node 与 Edge 同源），按严重度降序。
     **全量口径，不随选中链路过滤**（基线 §16.8：不得把可见子集当成状态聚合全集）；
     属于当前选中链路的条目高亮，其余降噪。
     计数徽标随计数变色：0 项时不得显示告警色，否则会被读成"存在告警"。 */
  excPool = abnormalObjects();
  $('#exceptionCount').className = 'chip' + (excPool.length ? ' abnormal' : '');
  $('#exceptionCount').textContent = excPool.length + ' 项';
  /* 清单为空才给空态；否则逐条列出。条目挂 data-exc 索引回查 excPool，
     方向条目另挂 data-tip（dir:*）以维持「有状态必有说明」的闭合性。 */
  $('#exceptions').innerHTML = excPool.length ? excPool.map((e, i) =>
    '<button class="exception ' + e.sev + ownCls(e) + (S.focus === e.node ? ' active' : '') + '"' +
      ' data-exc="' + i + '"' +
      ' data-own="' + (e.paths || []).join(',') + '"' +
      (e.tip ? ' data-tip="' + e.tip + '"' : '') + '>' +
      '<div class="exception-top"><b>' + e.title + '</b><span>' + e.time + '</span></div>' +
      '<small>' + e.detail + '</small>' +
      '<span class="imp">' + e.impact + '</span>' +
    '</button>').join('')
    : '<div class="list-empty">当前无异常对象</div>';

  /* 链路选择暂时停用：业务链路卡同步展示全部 Path 及其分段。 */
  if (!D.paths.length) {
    $('#pathList').innerHTML = '<div class="list-empty">当前单位没有已发布且启用 Path</div>';
  } else {
    $('#pathList').innerHTML = D.paths.map(p => {
      const segs = segsOf(p), starved = starvedDirs(p);
      const head = '<div class="path-group on"><span class="pg-name">' + p.name + '</span>' + chip(p.status) +
        '<small class="pg-meta">' + p.type + ' · ' + segs.length + ' 段</small></div>';
      const items = segs.map(sg => {
        const pair = segPair(sg), st = segStatus(sg);
        const dirs = ['down','up'].map(k => {
          const ds = starved[k].has(sg.id) ? 'impact' : sg[k];
          return '<span class="dirs" data-tip="dir:' + ds + '" style="color:' + DIR_CSS(ds) + '">' + dirLine(k, 14) +
            (k === 'down' ? '下行' : '上行') + DIR_CN(ds) + '</span>';
        }).join('');
        const strip = [sg.a, sg.via, sg.b].filter(Boolean).map(id => {
          const nd = node(id); return !nd ? id : nd.kind === 'device' ? nd.name : zoneOf(id);
        }).filter((v, i2, arr) => arr.indexOf(v) === i2);
        return '<button class="path-item is-seg' + (S.focusSeg === sg.id ? ' active' : '') + '"' +
          ' data-seg="' + sg.id + '" data-path="' + p.id + '">' +
          '<div class="pi-top"><span class="pi-name">' + pair + '</span>' + chip(st) + '</div>' +
          '<small><span>分段链路</span>' + dirs + '<span>更新 ' + p.updated + '</span></small>' +
          '<span class="pi-route">' + strip.map((z, i2) => (i2 ? '<i>›</i>' : '') + '<b>' + z + '</b>').join('') + '</span>' +
        '</button>';
      }).join('');
      return head + items;
    }).join('');
  }
}

/* ==========================================================================
   渲染：趋势图
   重做要点：按容器真实像素绘制（不再把 600×150 拉伸填满）、左右双轴各自成刻度、
   单调三次平滑（不过冲、不美化读数）、数据点标记、未知区间底纹、末值标注、随窗重绘
   ========================================================================== */
/* 取整刻度上界，避免 94 / 63 / 31 这类无法口算的坐标值 */
function niceScale(maxV, n) {
  if (!(maxV > 0)) return {top: n, ticks: Array.from({length: n + 1}, (_, i) => i)};
  const raw = maxV / n, mag = Math.pow(10, Math.floor(Math.log10(raw))), nz = raw / mag;
  const mult = nz <= 1 ? 1 : nz <= 2 ? 2 : nz <= 2.5 ? 2.5 : nz <= 3 ? 3 : nz <= 4 ? 4 : nz <= 5 ? 5 : 10;
  const step = mult * mag;
  return {top: step * n, ticks: Array.from({length: n + 1}, (_, i) => +(i * step).toFixed(6))};
}
const tickTxt = v => Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(1);

/* 单调三次插值：普通样条会在数据点附近过冲，读数会被曲线"美化"，此处刻意避免 */
function smoothPath(pts) {
  if (!pts.length) return '';
  if (pts.length === 1) return 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  const n = pts.length, dx = [], sl = [];
  for (let i = 0; i < n - 1; i++) {
    dx[i] = pts[i + 1][0] - pts[i][0];
    sl[i] = dx[i] ? (pts[i + 1][1] - pts[i][1]) / dx[i] : 0;
  }
  const tg = [sl[0]];
  for (let i = 1; i < n - 1; i++) {
    if (sl[i - 1] * sl[i] <= 0) { tg[i] = 0; continue; }
    const w1 = 2 * dx[i] + dx[i - 1], w2 = dx[i] + 2 * dx[i - 1];
    tg[i] = (w1 + w2) / (w1 / sl[i - 1] + w2 / sl[i]);
  }
  tg[n - 1] = sl[n - 2];
  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for (let i = 0; i < n - 1; i++) {
    const x0 = pts[i][0], y0 = pts[i][1], x1 = pts[i + 1][0], y1 = pts[i + 1][1];
    d += ' C' + (x0 + dx[i] / 3).toFixed(1) + ' ' + (y0 + tg[i] * dx[i] / 3).toFixed(1) +
         ' ' + (x1 - dx[i] / 3).toFixed(1) + ' ' + (y1 - tg[i + 1] * dx[i] / 3).toFixed(1) +
         ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1);
  }
  return d;
}

function renderChart() {
  const p = path(S.selected);
  const d = p.history;
  const box = $('#chartBox');
  /* 每次重绘先收起浮层：否则窗口变化后旧的绝对定位会残留在视口之外，撑大文档宽度 */
  const tip = $('#chartTip');
  tip.style.display = 'none';
  /* 关键：viewBox 与容器等尺寸，杜绝用 preserveAspectRatio="none" 把 600×150 拉满造成的填充放大 */
  const W = Math.max(320, Math.round(box.clientWidth));
  const H = Math.max(170, Math.round(box.clientHeight));
  const pl = 44, pr = 44, pt = 30, pb = 24;
  const iw = Math.max(40, W - pl - pr), ih = Math.max(40, H - pt - pb);
  const N = d.length;
  const X = i => pl + (N > 1 ? i / (N - 1) : 0) * iw;

  /* 两条序列分属不同量纲，必须各自成轴，不能共用一条纵轴 */
  const SER = [
    {k: 1, ax: 'l', color: '#38c6ff', name: '吞吐', unit: 'Mbps', dash: ''},
    {k: 2, ax: 'r', color: '#9d7bff', name: '时延', unit: 'ms', dash: 'dashed'}
  ];
  const sc = {};
  SER.forEach(s => { sc[s.ax] = niceScale(Math.max(0, ...d.map(q => q[s.k] == null ? 0 : q[s.k])), 4); });
  const Y = (ax, v) => pt + ih - Math.max(0, Math.min(1, v / sc[ax].top)) * ih;
  /* 序列在未知处断开，不连线、不以 0 替代 */
  const seg = (s, yf) => {
    let out = '', run = [];
    d.forEach((q, i) => {
      if (q[s.k] == null) { if (run.length) { out += smoothPath(run); run = []; } return; }
      run.push([X(i), yf(q[s.k])]);
    });
    return out + (run.length ? smoothPath(run) : '');
  };
  const ptOf = (s, yf) => d.map((q, i) => q[s.k] == null ? null : [X(i), yf(q[s.k])]).filter(Boolean);

  /* 纵轴：左吞吐 / 右时延，共用同一组水平网格线 */
  let grid = '';
  sc.l.ticks.forEach((v, i) => {
    const y = pt + ih - (v / sc.l.top) * ih;
    grid += '<line class="' + (i === 0 ? 'chart-base' : 'chart-grid') + '" x1="' + pl + '" y1="' + y.toFixed(1) +
      '" x2="' + (W - pr) + '" y2="' + y.toFixed(1) + '"/>';
    grid += '<text class="chart-ylab" x="' + (pl - 7) + '" y="' + (y + 3.2).toFixed(1) + '">' + tickTxt(v) + '</text>';
    grid += '<text class="chart-ylab r" x="' + (W - pr + 7) + '" y="' + (y + 3.2).toFixed(1) + '">' + tickTxt(sc.r.ticks[i]) + '</text>';
  });

  /* 横轴：按可用宽度决定标签密度，并保证末点始终有标签 */
  const labMax = Math.max(2, Math.floor(iw / 64));
  const step = Math.max(1, Math.ceil((N - 1) / labMax));
  let xlab = '';
  d.forEach((q, i) => {
    if (i % step !== 0 && i !== N - 1) return;
    xlab += '<line class="chart-tick" x1="' + X(i).toFixed(1) + '" y1="' + (pt + ih) + '" x2="' + X(i).toFixed(1) +
      '" y2="' + (pt + ih + 4) + '"/>' +
      '<text class="chart-xlab" x="' + X(i).toFixed(1) + '" y="' + (pt + ih + 15) + '">' + q[0] + '</text>';
  });

  /* 未知区间：底纹 + 边界虚线，明确"没有数据"而非"数据为 0" */
  const runs = [];
  let open = -1;
  d.forEach((q, i) => {
    const unk = q[1] == null && q[2] == null;
    if (unk && open < 0) open = i;
    if (!unk && open >= 0) { runs.push([open, i - 1]); open = -1; }
  });
  if (open >= 0) runs.push([open, N - 1]);
  let unk = '';
  runs.forEach(([a, b]) => {
    const x0 = a > 0 ? (X(a - 1) + X(a)) / 2 : X(a);
    const x1 = b < N - 1 ? (X(b) + X(b + 1)) / 2 : X(b);
    unk += '<rect class="chart-unk" x="' + x0.toFixed(1) + '" y="' + pt + '" width="' + Math.max(1, x1 - x0).toFixed(1) +
      '" height="' + ih + '"/>' +
      '<line class="chart-unk-edge" x1="' + x0.toFixed(1) + '" y1="' + pt + '" x2="' + x0.toFixed(1) + '" y2="' + (pt + ih) + '"/>' +
      '<line class="chart-unk-edge" x1="' + x1.toFixed(1) + '" y1="' + pt + '" x2="' + x1.toFixed(1) + '" y2="' + (pt + ih) + '"/>';
    if (x1 - x0 > 36) unk += '<text class="chart-unk-label" x="' + ((x0 + x1) / 2).toFixed(1) + '" y="' + (pt + 12) + '">未知</text>';
  });

  /* 吞吐面积（同样在未知处断开） */
  let area = '';
  { let run = [];
    d.forEach((q, i) => {
      if (q[1] == null) { if (run.length > 1) area += areaPath(run, pt + ih); run = []; return; }
      run.push([X(i), Y('l', q[1])]);
    });
    if (run.length > 1) area += areaPath(run, pt + ih);
  }

  /* 数据点标记：吞吐实心圆、时延菱形 */
  let marks = '';
  ptOf(SER[0], v => Y('l', v)).forEach(([x, y]) => {
    marks += '<circle class="chart-pt" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2.7"/>';
  });
  ptOf(SER[1], v => Y('r', v)).forEach(([x, y]) => {
    marks += '<rect class="chart-pt-lat" x="' + (x - 2.2).toFixed(1) + '" y="' + (y - 2.2).toFixed(1) +
      '" width="4.4" height="4.4" transform="rotate(45 ' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"/>';
  });

  /* 末值标注：一律置于数据点上方；两点纵向过近时错开，且始终留在绘图区内，
     避免落进横轴标签行或超出卡片 */
  const lastIdx = SER.map(s => {
    for (let i = N - 1; i >= 0; i--) if (d[i][s.k] != null) return i;
    return -1;
  });
  const lastY = SER.map((s, si) => lastIdx[si] < 0 ? null : Y(s.ax, d[lastIdx[si]][s.k]));
  let callout = '';
  if (lastIdx[0] >= 0 || lastIdx[1] >= 0) {
    /* 关键：不能逐条钳制。两条序列末值靠得很近时，逐条 Math.max/Math.min
       会把错开量整段压掉（实测两条都落到 pt+10 / pt+12，文字叠成乱码）。
       改为先保证最小间距，再把两条标注作为整体平移到绘图区内。 */
    const GAP = 14, TOP = pt + 10, BOT = pt + ih - 6;
    const ys = [0, 1].map(si => lastY[si] == null ? null : lastY[si] - 8);
    if (ys[0] != null && ys[1] != null) {
      const up = ys[0] <= ys[1] ? 0 : 1, dn = 1 - up;   /* 点位靠上的那条排在上面 */
      if (ys[dn] - ys[up] < GAP) ys[dn] = ys[up] + GAP;
      if (ys[up] < TOP) { const dd = TOP - ys[up]; ys[up] += dd; ys[dn] += dd; }
      if (ys[dn] > BOT) { const dd = ys[dn] - BOT; ys[up] -= dd; ys[dn] -= dd; }
    } else {
      const si = ys[0] == null ? 1 : 0;
      ys[si] = Math.max(TOP, Math.min(BOT, ys[si]));
    }
    SER.forEach((s, si) => {
      if (lastIdx[si] < 0 || ys[si] == null) return;
      const x = X(lastIdx[si]);
      const right = lastIdx[si] > (N - 1) * 0.7;
      callout += '<text class="chart-callout" x="' + (x + (right ? -9 : 9)).toFixed(1) + '" y="' + ys[si].toFixed(1) +
        '" text-anchor="' + (right ? 'end' : 'start') + '" fill="' + s.color + '">' +
        tickTxt(d[lastIdx[si]][s.k]) + ' ' + s.unit + '</text>';
    });
  }

  const axisTitle =
    '<text class="chart-axlab" x="' + pl + '" y="' + (pt - 13) + '" fill="#38c6ff">吞吐 Mbps</text>' +
    '<text class="chart-axlab" x="' + (W - pr) + '" y="' + (pt - 13) + '" text-anchor="end" fill="#9d7bff">时延 ms</text>';

  const svgEl = $('#chart');
  svgEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svgEl.innerHTML =
    '<defs>' +
      '<linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#38c6ff" stop-opacity=".30"/>' +
        '<stop offset="1" stop-color="#38c6ff" stop-opacity="0"/></linearGradient>' +
      '<pattern id="hUnk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
        '<rect width="8" height="8" fill="rgba(132,146,168,.06)"/>' +
        '<line x1="0" y1="0" x2="0" y2="8" stroke="rgba(132,146,168,.30)" stroke-width="2"/></pattern>' +
    '</defs>' +
    unk + grid + xlab + axisTitle +
    '<path d="' + area + '" fill="url(#gArea)"/>' +
    '<path d="' + seg(SER[0], v => Y('l', v)) + '" fill="none" stroke="#38c6ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path d="' + seg(SER[1], v => Y('r', v)) + '" fill="none" stroke="#9d7bff" stroke-width="1.9" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/>' +
    marks + callout +
    '<line id="crosshair" class="crosshair" x1="0" y1="' + pt + '" x2="0" y2="' + (pt + ih) + '" opacity="0"/>' +
    '<circle id="hDot0" class="chart-hit l" r="5.4" opacity="0"/>' +
    '<circle id="hDot1" class="chart-hit r" r="5.4" opacity="0"/>';

  $('#chartLegend').innerHTML = SER.map(s =>
    '<span><i style="border-top-color:' + s.color + ';border-top-style:' + (s.dash || 'solid') + '"></i>' +
    s.name + ' ' + s.unit + '</span>').join('');

  $('#chartTitle').textContent = p.name + ' · 吞吐 / 时延';
  $('#chartStatus').className = 'chip ' + p.status;
  $('#chartStatus').textContent = STATUS[p.status];
  $('#chartStatus').dataset.tip = 'path:' + p.status;
  $('#chartNow').innerHTML = p.metrics.bps === null
    ? '最近有效监测已过期，当前指标 <b>未知</b>'
    : '吞吐 <b>' + p.metrics.bps + ' Mbps</b> · 时延 <b>' + p.metrics.lat + ' ms</b>';

  /* 悬停：十字准线 + 命中点高亮 + 浮层 */
  const cross = $('#crosshair'), h0 = $('#hDot0'), h1 = $('#hDot1');
  const showDot = (el, s, q, i) => {
    if (q[s.k] == null) { el.setAttribute('opacity', '0'); return; }
    el.setAttribute('cx', X(i).toFixed(1));
    el.setAttribute('cy', Y(s.ax, q[s.k]).toFixed(1));
    el.setAttribute('opacity', '1');
  };
  svgEl.onmousemove = e => {
    const r = svgEl.getBoundingClientRect();
    const i = Math.max(0, Math.min(N - 1, Math.round((e.clientX - r.left) / r.width * (N - 1))));
    const q = d[i];
    cross.setAttribute('x1', X(i).toFixed(1));
    cross.setAttribute('x2', X(i).toFixed(1));
    cross.setAttribute('opacity', '1');
    showDot(h0, SER[0], q, i); showDot(h1, SER[1], q, i);
    tip.style.display = 'block';
    tip.innerHTML = q[0] + '<br>吞吐 <b>' + (q[1] ?? '未知') + '</b> Mbps<br>时延 <b>' + (q[2] ?? '未知') + '</b> ms' +
      (q[1] == null && q[2] == null ? '<br><span style="color:#8492a8">该时刻无有效监测数据</span>' : '');
    const wr = svgEl.parentElement.getBoundingClientRect();
    let tx = e.clientX - wr.left + 12, ty = e.clientY - wr.top - tip.offsetHeight - 10;
    if (tx + tip.offsetWidth > wr.width - 4) tx = Math.max(4, e.clientX - wr.left - tip.offsetWidth - 12);
    if (ty < 4) ty = e.clientY - wr.top + 14;
    tip.style.left = tx + 'px';
    tip.style.top = ty + 'px';
  };
  svgEl.onmouseleave = () => {
    tip.style.display = 'none';
    cross.setAttribute('opacity', '0');
    h0.setAttribute('opacity', '0'); h1.setAttribute('opacity', '0');
  };
}
/* 面积路径：折线 + 回到基线闭合 */
function areaPath(run) {
  const last = run[run.length - 1], first = run[0];
  const base = Math.max(...run.map(q => q[1]));
  return smoothPath(run) + ' L' + last[0].toFixed(1) + ' ' + (base + 1000).toFixed(1) +
    ' L' + first[0].toFixed(1) + ' ' + (base + 1000).toFixed(1) + ' Z';
}

function open(id) {

  };
  const f = flowMap[n.flow];
  const kindTxt = n.kind === 'device' ? '安全装置' : '业务节点';
  const rn = n.loc || '—';

  $('#drawerBody').innerHTML =
    '<div class="dw-head">' +
      '<div class="dw-ic">' + iconFor(n) + '</div>' +

    '</div>' +
    '<div class="dw-flow ' + f.cls + '">' + f.text + '</div>' +
    '<p style="padding:8px 18px 0;font-size:12px;color:var(--muted);line-height:1.6">' + n.note + '</p>' +
    '<div class="dw-sec">基础信息</div>' +
    '<table class="dw-tbl">' +
      '<tr><td>对象类型</td><td>' + kindTxt + '</td></tr>' +
      '<tr><td>所属分区</td><td>' + rn + '</td></tr>' +
      '<tr><td>主状态</td><td>' + STATUS[n.status] + '</td></tr>' +
      '<tr><td>数据流转</td><td>' + ({blocked:'阻断', impacted:'上游中断', normal:'正常'}[n.flow]) + '</td></tr>' +
      '<tr><td>最近更新</td><td>2026-09-20 ' + n.updated + '</td></tr>' +
    '</table>' +
    '<div class="dw-sec">关键指标</div>' +
    '<div class="dw-kv">' +
      Object.entries(n.m).map(([k, v]) => '<div><span>' + k + '</span><b>' + v + '</b></div>').join('') +
    '</div>' +
    '<div class="dw-sec">相邻链路与方向状态</div>' +
    '<div class="dw-rel">' +
      (segs.length ? segs.map(s => {
        const other = s.via === n.id
          ? (node(s.a) || {}) : (node(s.via) || {});
        const otherName = s.via === n.id ? (other.name || '—') : (other.name || '—');
        return '<div><span>' + n.name + ' ⇄ ' + otherName + '</span>' +
          '<span class="dw-dirs">' +
            '<em style="color:' + DIR_CSS(s.down) + '">下行' + DIR_CN(s.down) + '</em>' +
            '<em style="color:' + DIR_CSS(s.up) + '">上行' + DIR_CN(s.up) + '</em>' +
          '</span></div>';
      }).join('') : '<div><span>暂无相邻链路</span></div>') +
    '</div>' +
    '<div class="dw-sec">关联业务链路</div>' +
    '<div class="dw-rel">' +
      (ps.length ? ps.map(p =>
        '<div><span>' + p.name + '</span>' + chip(p.status) + '</div>').join('')

    '</div>' +

function bindEvents() {
  /* 拓扑 / 清单 / 链路：事件委托 */
  document.addEventListener('click', e => {
    const n = e.target.closest('[data-node]');
    const p = e.target.closest('[data-path]');
    const v = e.target.closest('[data-exc]');
    if (n) { open(n.dataset.node); return; }
    if (p) {
      const g0 = e.target.closest('[data-seg]');
      if (g0) {
        /* 分段聚焦：把该段作为一个整体高亮（两端节点 + 经过的装置 + 该段连线），
           其余降噪；再点同一条目即取消 */
        S.selected = p.dataset.path;
        S.focusSeg = (S.focusSeg === g0.dataset.seg) ? null : g0.dataset.seg;
        render(); return;
      }
      selectPath(p.dataset.path); return;
    }
    if (v) {
      /* 清单条目按索引回查渲染集（Node 条目与 Edge 方向条目共用同一路径） */
      const x = excPool[+v.dataset.exc];
      if (x && x.node) { if (x.path) S.selected = x.path; open(x.node); }
    }
  });
  /* 告警严重度筛选 */
  $('#afilter').addEventListener('click', e => {
    const b = e.target.closest('[data-sev]');
    if (!b) return;
    sevFilter = b.dataset.sev;
    renderAlarms();
  });
  /* 查询 / 重置 */
  $('#query').onclick = () => {
    S.path = $('#path').value;
    S.status = $('#status').value;
    const p = D.paths.find(match);
    if (p) S.selected = p.id;
    S.focus = null; S.focusSeg = null;
    toast(p ? '已聚焦符合条件的链路' : '无匹配链路，保留当前拓扑');
    render();
  };
  $('#reset').onclick = () => {
    S.path = 'all'; S.status = 'all';
    S.selected = 'p-full'; S.focus = null; S.focusSeg = null;
    $('#path').value = 'all'; $('#status').value = 'all';
    toast('已重置查询条件');
    render();
  };
  /* 立即刷新：更新当前样例对象时间并重绘，不改变任何业务状态。 */
  $('#refresh').onclick = () => {
    const d = new Date(), now = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    D.nodes.forEach(n => { n.updated = now; });
    D.paths.forEach(p => { p.updated = now; });
    render();
    setLive(true);
    toast('已立即刷新当前监控视图');
  };
  /* 全屏 */
  $('#full').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => toast('浏览器阻止全屏'));
  };
  $('#topoPrev').onclick = () => $('#topo').scrollBy({left:-300,behavior:'smooth'});
  $('#topoNext').onclick = () => $('#topo').scrollBy({left:300,behavior:'smooth'});
  $('#topo').addEventListener('scroll', updateTopoNav, {passive:true});
  /* 抽屉关闭 */
  $('#close').onclick = closeDrawer;
  $('#overlay').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  /* 尺寸变化重绘连线 */
  let rt = null;
  const redraw = () => { clearTimeout(rt); rt = setTimeout(() => { hideTip(); drawEdges(); renderChart(); updateTopoNav(); }, 90); };
  window.addEventListener('resize', redraw);
  if (window.ResizeObserver) new ResizeObserver(redraw).observe($('#topoCanvas'));
}

/* ==========================================================================
   启动
   ========================================================================== */
function init() {
  bindEvents();
  initFilters();
  seedAlarms();
  setLive(true);
  render();
  /* 首屏先由既有对象状态派生一条告警（异常对象池首项），避免告警区留白 */
  if (!alarms.length) { const a0 = deriveAlarm(); if (a0) pushAlarm(a0); }

  /* 时钟 */
  const clock = () => {
    const d = new Date();
    $('#clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    $('#date').textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' 星期' + '日一二三四五六'[d.getDay()];
  };
  clock();
  setInterval(clock, 1000);

  /* 实时告警：每 7s 推入一条由既有对象状态派生的告警 */
  setInterval(() => {
    const a = deriveAlarm();
    if (a) pushAlarm(a);
  }, 7000);

  /* 连线与趋势图在字体/布局稳定后再校准一次 */
  const settle = () => { drawEdges(); renderChart(); };
  setTimeout(settle, 60);
  window.addEventListener('load', settle);
}
init();
})();
</script>
</body>
</html>
