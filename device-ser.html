<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设备服务查询</title>
  <style>
    :root {
      --primary: #2468f2;
      --primary-hover: #1454d8;
      --primary-soft: #eaf1ff;
      --bg: #f3f5f9;
      --panel: #ffffff;
      --line: #e3e8f0;
      --text: #27364b;
      --muted: #758196;
      --placeholder: #a8b1c1;
      --success: #21a366;
      --warning: #f29b38;
      --danger: #ee5b5b;
      --tree-bg: #f7f9fc;
      --shadow: 0 6px 18px rgba(42, 61, 91, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font: 14px/1.5 "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app-shell {
      display: flex;
      height: 100vh;
      padding: 12px;
      gap: 12px;
    }

    input:focus, select:focus { border-color: #74a1ff !important; box-shadow: 0 0 0 2px rgba(36,104,242,.08); }

    .content-panel {
      min-width: 0; flex: 1; display: flex; flex-direction: column;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    }

    .query-area { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); }
    .quick-row { display: flex; align-items: center; gap: 10px; min-width: max-content; }
    .field { display: flex; align-items: center; min-width: 0; }
    .field-label {
      height: 36px; display: inline-flex; align-items: center; padding: 0 10px;
      border: 1px solid #d9e0ea; border-right: 0; border-radius: 5px 0 0 5px;
      color: #3d4b60; background: #fafbfd; white-space: nowrap;
    }
    .field input, .field select, .plain-input, .plain-select {
      height: 36px; border: 1px solid #d9e0ea; background: #fff; color: var(--text);
      outline: 0; padding: 0 10px; min-width: 0;
    }
    .field input, .field select { width: 148px; border-radius: 0 5px 5px 0; }
    .field input::placeholder, .plain-input::placeholder { color: var(--placeholder); }
    select { color: #66758a; }
    .org-field input { width: 156px; }

    .actions { display: flex; gap: 8px; margin-left: auto; }
    .btn {
      height: 34px; padding: 0 16px; border: 1px solid #d5dce7; border-radius: 5px;
      background: #fff; color: #526075; transition: .15s; white-space: nowrap;
    }
    .btn:hover { color: var(--primary); border-color: #8db0fa; }
    .btn-primary { color: #fff; border-color: var(--primary); background: var(--primary); }
    .btn-primary:hover { color: #fff; background: var(--primary-hover); border-color: var(--primary-hover); }
    .btn-text { color: var(--primary); border-color: #b8cdfb; background: #f6f9ff; }
    .btn .chevron { display: inline-block; margin-left: 6px; transition: transform .18s; }
    .btn.expanded .chevron { transform: rotate(180deg); }

    .advanced-panel {
      display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px 18px;
      margin-top: 0; padding: 0 14px; max-height: 0; opacity: 0; overflow: hidden;
      background: #f6f8fd; border: 0 solid #e3e9f4; border-radius: 6px;
      transition: max-height .25s ease, opacity .18s ease, margin-top .25s, padding .25s, border-width .25s;
    }
    .advanced-panel.open {
      max-height: 340px; opacity: 1; margin-top: 12px; padding: 14px; border-width: 1px;
    }
    .advanced-item { min-width: 0; }
    .advanced-item > label { display: block; margin-bottom: 6px; color: #647187; font-size: 13px; }
    .plain-input, .plain-select { width: 100%; border-radius: 5px; }
    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: 1 / -1; }
    .date-range { display: grid; grid-template-columns: 1fr 20px 1fr; align-items: center; gap: 5px; }
    .date-range span { text-align: center; color: #929daf; }
    .date-range input { width: 100%; }
    .cascade { display: grid; grid-template-columns: 1fr 1.15fr 1.35fr; gap: 8px; }
    .model-attribute-grid { display: grid; grid-template-columns: minmax(210px, .9fr) minmax(520px, 2.5fr) minmax(190px, 1fr); gap: 14px; align-items: end; }
    .model-attribute-grid label { display: block; margin-bottom: 6px; color: #647187; font-size: 13px; }
    .advanced-footer { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: -2px; }

    .table-toolbar {
      height: 46px; flex: 0 0 46px; padding: 0 14px; display: flex; align-items: center;
      border-bottom: 1px solid var(--line); background: #fff;
    }
    .result-summary { color: #5e6b7d; }
    .result-summary strong { color: var(--primary); font-size: 16px; margin: 0 3px; }
    .selected-summary { margin-left: 14px; color: #8692a5; }
    .toolbar-tip { margin-left: auto; color: #8b97a9; font-size: 13px; }

    .table-wrap { position: relative; flex: 1; min-height: 0; overflow: auto; }
    table { width: 100%; min-width: 1740px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    th, td {
      height: 44px; padding: 0 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    th {
      position: sticky; z-index: 3; top: 0; height: 46px; background: #f7f9fc;
      color: #3e4c61; font-weight: 600;
    }
    tbody tr:nth-child(even) td { background: #f8fafc; }
    tbody tr:hover td { background: #edf4ff; }
    th:first-child, td:first-child { width: 48px; text-align: center; padding: 0; }
    .check { width: 15px; height: 15px; accent-color: var(--primary); }
    .code-cell { color: #4b617e; font-family: Consolas, "Microsoft YaHei", monospace; font-size: 13px; }
    .device-name { color: #2d5fae; font-weight: 500; }
    .tag {
      display: inline-flex; align-items: center; height: 23px; padding: 0 8px; border-radius: 12px;
      font-size: 12px; border: 1px solid transparent;
    }
    .tag.success { color: #168554; background: #e8f7ef; border-color: #bde7d0; }
    .tag.warning { color: #b66a12; background: #fff4e4; border-color: #f5d5a7; }
    .tag.info { color: #2863ca; background: #eaf1ff; border-color: #c5d8ff; }
    .tag.muted { color: #7a8799; background: #f0f2f5; border-color: #dfe3e9; }
    .status-dot { width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: currentColor; }
    .empty-state { display: none; padding: 70px 20px; text-align: center; color: #98a4b6; }
    .empty-state .empty-icon { font-size: 42px; opacity: .65; }

    .pagination {
      height: 56px; flex: 0 0 56px; padding: 0 14px; display: flex; align-items: center;
      border-top: 1px solid var(--line); background: #fff; color: #6c788b;
    }
    .page-size { margin-left: 12px; height: 32px; padding: 0 8px; border: 1px solid #d9e0ea; border-radius: 4px; color: #607086; }
    .pages { display: flex; align-items: center; gap: 5px; margin-left: auto; }
    .page-btn {
      min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: 4px;
      background: #fff; color: #556277;
    }
    .page-btn:hover { color: var(--primary); border-color: #bfd0f5; }
    .page-btn.active { color: #fff; background: var(--primary); border-color: var(--primary); }

    .toast {
      position: fixed; z-index: 30; left: 50%; top: 26px; transform: translate(-50%, -15px);
      padding: 10px 18px; border-radius: 6px; background: #26354a; color: #fff;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .2s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1450px) {
      .quick-row { gap: 5px; }
      .field input, .field select { width: 112px; }
      .org-field input { width: 132px; }
      .btn { padding: 0 12px; }
      .advanced-panel { grid-template-columns: repeat(3, minmax(220px, 1fr)); }
    }
    @media (max-width: 1050px) {
      .field:nth-of-type(3) { display: none; }
      .advanced-panel { grid-template-columns: repeat(2, minmax(220px, 1fr)); }
      .model-attribute-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">

    <section class="content-panel">
      <section class="query-area" aria-label="设备查询条件">
        <div class="quick-row">
          <div class="field"><span class="field-label">终端名称</span><input id="terminalName" placeholder="请输入终端名称" /></div>
          <div class="field"><span class="field-label">物联标识码</span><input id="iotCode" placeholder="请输入标识码" /></div>
          <div class="field"><span class="field-label">终端型号</span><input id="terminalModel" placeholder="请输入终端型号" /></div>
          <div class="field org-field"><span class="field-label">所属单位</span><input id="orgName" placeholder="请输入所属单位" /></div>
          <div class="actions">
            <button class="btn btn-primary" id="queryBtn">查询</button>
            <button class="btn" id="resetBtn">重置</button>
            <button class="btn btn-text" id="advancedBtn">高级筛选<span class="chevron">⌄</span></button>
            <button class="btn" id="exportBtn">⇩&nbsp; 导出</button>
          </div>
        </div>

        <div class="advanced-panel" id="advancedPanel">
          <div class="advanced-item"><label for="categoryName">所属品类</label><input class="plain-input" id="categoryName" type="text" placeholder="请输入所属品类" /></div>
          <div class="advanced-item"><label for="projectName">所属项目</label><input class="plain-input" id="projectName" placeholder="请输入所属项目" /></div>
          <div class="advanced-item"><label for="monitorTarget">监测对象</label><input class="plain-input" id="monitorTarget" placeholder="请输入监测对象" /></div>
          <div class="advanced-item"><label for="businessStatus">终端业务状态</label><select class="plain-select" id="businessStatus"><option value="">全部状态</option><option>在线</option><option>离线</option></select></div>
          <div class="advanced-item"><label for="manageStatus">终端管理状态</label><select class="plain-select" id="manageStatus"><option value="">全部状态</option><option>在线</option><option>离线</option><option>休眠</option></select></div>
          <div class="model-attribute-grid span-4">
            <div>
              <label for="thingModel">物模型名称</label>
              <select class="plain-select" id="thingModel"><option value="" selected disabled hidden>请选择物模型</option></select>
            </div>
            <div>
              <label>属性名称</label>
              <div class="cascade">
                <select class="plain-select" id="dataCategory" aria-label="参数分类" disabled><option value="" selected disabled hidden>参数分类</option></select>
                <select class="plain-select" id="serviceName" aria-label="服务名称" disabled><option value="" selected disabled hidden>服务名称</option></select>
                <select class="plain-select" id="attributeName" aria-label="属性名称" disabled><option value="" selected disabled hidden>属性名称</option></select>
              </div>
            </div>
            <div><label for="attributeValue">属性值</label><div id="attributeValueWrap"><input class="plain-input" id="attributeValue" placeholder="请先选择属性" disabled /></div></div>
          </div>
          <div class="advanced-item span-2"><label>最近在线时间</label><div class="date-range"><input class="plain-input" id="onlineStart" type="datetime-local" /><span>至</span><input class="plain-input" id="onlineEnd" type="datetime-local" /></div></div>
          <div class="advanced-item span-2"><label>最近离线时间</label><div class="date-range"><input class="plain-input" id="offlineStart" type="datetime-local" /><span>至</span><input class="plain-input" id="offlineEnd" type="datetime-local" /></div></div>
          <div class="advanced-footer"><button class="btn" id="collapseAdvanced">收起⌃</button></div>
        </div>
      </section>

      <div class="table-toolbar">
        <span class="result-summary">共 <strong id="resultCount">0</strong> 条设备</span>
        <span class="selected-summary" id="selectedSummary">已选择 0 项</span>
        <span class="toolbar-tip" id="categoryTip">设备数据列表</span>
      </div>

      <div class="table-wrap" id="tableWrap">
        <table aria-label="设备查询结果">
          <colgroup>
            <col style="width:48px"><col style="width:190px"><col style="width:190px"><col style="width:130px">
            <col style="width:100px"><col style="width:180px"><col style="width:150px"><col style="width:145px">
            <col style="width:105px"><col style="width:120px"><col style="width:120px"><col style="width:165px">
            <col style="width:165px"><col style="width:165px"><col style="width:165px">
          </colgroup>
          <thead>
            <tr>
              <th><input class="check" id="checkAll" type="checkbox" aria-label="全选" /></th>
              <th>物联标识码</th><th>终端名称</th><th>终端型号</th><th>安全分区</th><th>所属单位</th>
              <th>所属项目</th><th>监测对象</th><th>运行状态</th><th>终端业务状态</th><th>终端管理状态</th>
              <th>首次上线时间</th><th>最近上线时间</th><th>最近离线时间</th><th>创建时间</th>
            </tr>
          </thead>
          <tbody id="deviceBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState"><div class="empty-icon">⌕</div><div>暂无符合条件的设备</div></div>
      </div>

      <footer class="pagination">
        <span id="pageTotal">共 0 条</span>
        <select class="page-size" aria-label="每页条数"><option>10 条/页</option><option>20 条/页</option><option>50 条/页</option></select>
        <div class="pages"><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">2</button><button class="page-btn">›</button></div>
      </footer>
    </section>
  </main>

      '消息和服务': {
        '遥控服务': [{name:'开关状态', type:'enum', options:['合闸','分闸']}],
        '告警服务': [{name:'告警级别', type:'enum', options:['一般','重要','严重']}]
      }
    };

    const $ = id => document.getElementById(id);
    let filteredDevices = [...devices];
    let toastTimer;

    function statusTag(value, type) {
      const cls = value === '在线' || value === '投运' ? 'success' : value === '告警' || value === '调试中' || value === '休眠' ? 'warning' : 'muted';
      return `<span class="tag ${type || cls}"><i class="status-dot"></i>${value}</span>`;
    }

    function renderRows() {
      const body = $('deviceBody');
      body.innerHTML = filteredDevices.map((d, i) => `
        <tr>
          <td><input class="check row-check" type="checkbox" data-index="${i}" aria-label="选择${d.name}" /></td>
          <td class="code-cell" title="${d.code}">${d.code}</td>
          <td class="device-name" title="${d.name}">${d.name}</td>
          <td>${d.model}</td><td>${d.zone}</td><td title="${d.org}">${d.org}</td>
          <td title="${d.project}">${d.project}</td><td title="${d.target}">${d.target}</td>
          <td>${statusTag(d.run, d.run === '投运' ? 'info' : '')}</td><td>${statusTag(d.business)}</td><td>${statusTag(d.manage)}</td>
          <td>${d.first}</td><td>${d.online}</td><td>${d.offline}</td><td>${d.created}</td>
        </tr>`).join('');
      const hasData = filteredDevices.length > 0;
      document.querySelector('table').style.display = hasData ? 'table' : 'none';
      $('emptyState').style.display = hasData ? 'none' : 'block';
      $('resultCount').textContent = filteredDevices.length;
      $('pageTotal').textContent = `共 ${filteredDevices.length} 条`;
      $('checkAll').checked = false;
      updateSelected();
      bindRowEvents();
    }

    function bindRowEvents() {
      document.querySelectorAll('.row-check').forEach(el => el.addEventListener('change', updateSelected));
    }

    function updateSelected() {
      const total = document.querySelectorAll('.row-check:checked').length;
      $('selectedSummary').textContent = `已选择 ${total} 项`;
    }

    function showToast(message) {
      clearTimeout(toastTimer); $('toast').textContent = message; $('toast').classList.add('show');
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2200);
    }

    function inRange(dateText, start, end) {
      if (!start && !end) return true;
      const value = new Date(dateText.replace(' ', 'T')).getTime();
      return (!start || value >= new Date(start).getTime()) && (!end || value <= new Date(end).getTime());
    }

    function runQuery() {
      const val = id => $(id).value.trim().toLowerCase();
      const attr = $('attributeName').value;
      const attrValue = $('attributeValue') ? $('attributeValue').value.trim().toLowerCase() : '';
      filteredDevices = devices.filter(d => {
        const attrMatch = !attr || (Object.prototype.hasOwnProperty.call(d.attrs, attr) && (!attrValue || String(d.attrs[attr]).toLowerCase().includes(attrValue)));
        return (!val('categoryName') || d.category.toLowerCase().includes(val('categoryName')))
          && (!val('terminalName') || d.name.toLowerCase().includes(val('terminalName')))
          && (!val('iotCode') || d.code.toLowerCase().includes(val('iotCode')))
          && (!val('terminalModel') || d.model.toLowerCase().includes(val('terminalModel')))
          && (!val('thingModel') || d.thingModel.toLowerCase().includes(val('thingModel')))
          && (!val('orgName') || d.org.toLowerCase().includes(val('orgName')))
          && (!val('projectName') || d.project.toLowerCase().includes(val('projectName')))
          && (!val('monitorTarget') || d.target.toLowerCase().includes(val('monitorTarget')))
          && (!$('businessStatus').value || d.business === $('businessStatus').value)
          && (!$('manageStatus').value || d.manage === $('manageStatus').value)
          && inRange(d.online, $('onlineStart').value, $('onlineEnd').value)
          && inRange(d.offline, $('offlineStart').value, $('offlineEnd').value)
          && attrMatch;
      });
      renderRows();
      $('categoryTip').textContent = val('categoryName') ? `所属品类：${$('categoryName').value.trim()}` : '设备数据列表';
      showToast(`查询完成，共找到 ${filteredDevices.length} 条设备`);
    }

    function clearQueryFields() {
      document.querySelectorAll('.query-area input').forEach(el => { if (el.type !== 'checkbox') el.value = ''; });
      document.querySelectorAll('.query-area select').forEach(el => el.selectedIndex = 0);
      $('serviceName').innerHTML = '<option value="" selected disabled hidden>服务名称</option>';
      $('attributeName').innerHTML = '<option value="" selected disabled hidden>属性名称</option>';
      $('dataCategory').disabled = true;
      $('serviceName').disabled = true;
      $('attributeName').disabled = true;
      renderAttributeInput();
    }

    function resetQuery() {
      clearQueryFields();
      $('categoryTip').textContent = '设备数据列表';
      filteredDevices = [...devices]; renderRows(); showToast('查询条件已重置');
    }

    function exportCsv() {
      const headers = ['物联标识码','终端名称','终端型号','安全分区','所属单位','所属项目','监测对象','运行状态','业务状态','管理状态','首次上线时间','最近上线时间','最近离线时间','创建时间'];
      const rows = filteredDevices.map(d => [d.code,d.name,d.model,d.zone,d.org,d.project,d.target,d.run,d.business,d.manage,d.first,d.online,d.offline,d.created]);
      const csv = '\ufeff' + [headers, ...rows].map(row => row.map(v => `"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
      const a = document.createElement('a'); a.href = url; a.download = '设备查询结果.csv'; a.click(); URL.revokeObjectURL(url);
      showToast(`已导出 ${filteredDevices.length} 条设备数据`);
    }

    function renderAttributeInput(config) {
      const wrap = $('attributeValueWrap');
      if (!config) { wrap.innerHTML = '<input class="plain-input" id="attributeValue" placeholder="请先选择属性" disabled />'; return; }
      if (config.type === 'enum') wrap.innerHTML = `<select class="plain-select" id="attributeValue"><option value="">请选择</option>${config.options.map(v => `<option>${v}</option>`).join('')}</select>`;
      else if (config.type === 'number') wrap.innerHTML = '<input class="plain-input" id="attributeValue" type="number" step="any" placeholder="请输入数值" />';
      else if (config.type === 'date') wrap.innerHTML = '<input class="plain-input" id="attributeValue" type="date" />';
      else wrap.innerHTML = '<input class="plain-input" id="attributeValue" placeholder="请输入属性值" />';
    }

    function initCascade() {
      const modelNames = [...new Set(devices.map(device => device.thingModel))];
      $('thingModel').innerHTML += modelNames.map(name => `<option>${name}</option>`).join('');
      $('dataCategory').innerHTML += Object.keys(attributeTree).map(k => `<option>${k}</option>`).join('');
      $('thingModel').addEventListener('change', e => {
        $('dataCategory').selectedIndex = 0;
        $('dataCategory').disabled = !e.target.value;
        $('serviceName').innerHTML = '<option value="" selected disabled hidden>服务名称</option>';
        $('attributeName').innerHTML = '<option value="" selected disabled hidden>属性名称</option>';
        $('serviceName').disabled = true;
        $('attributeName').disabled = true;
        renderAttributeInput();
      });
      $('dataCategory').addEventListener('change', e => {
        const services = attributeTree[e.target.value] || {};
        $('serviceName').innerHTML = '<option value="" selected disabled hidden>服务名称</option>' + Object.keys(services).map(k => `<option>${k}</option>`).join('');
        $('serviceName').disabled = !e.target.value; $('attributeName').innerHTML = '<option value="" selected disabled hidden>属性名称</option>'; $('attributeName').disabled = true; renderAttributeInput();
      });
      $('serviceName').addEventListener('change', e => {
        const list = attributeTree[$('dataCategory').value]?.[e.target.value] || [];
        $('attributeName').innerHTML = '<option value="" selected disabled hidden>属性名称</option>' + list.map(x => `<option value="${x.name}">${x.name}</option>`).join('');
        $('attributeName').disabled = !e.target.value; renderAttributeInput();
      });
      $('attributeName').addEventListener('change', e => {
        const list = attributeTree[$('dataCategory').value]?.[$('serviceName').value] || [];
        renderAttributeInput(list.find(x => x.name === e.target.value));
      });
    }

    function toggleAdvanced(open) {
      const shouldOpen = open ?? !$('advancedPanel').classList.contains('open');
      $('advancedPanel').classList.toggle('open', shouldOpen); $('advancedBtn').classList.toggle('expanded', shouldOpen);
      $('advancedBtn').setAttribute('aria-expanded', String(shouldOpen));
    }

    $('advancedBtn').addEventListener('click', () => toggleAdvanced());
    $('collapseAdvanced').addEventListener('click', () => toggleAdvanced(false));
    $('queryBtn').addEventListener('click', runQuery);
    $('resetBtn').addEventListener('click', resetQuery);
    $('exportBtn').addEventListener('click', exportCsv);
    $('checkAll').addEventListener('change', e => { document.querySelectorAll('.row-check').forEach(x => x.checked = e.target.checked); updateSelected(); });
    document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('.query-area')) runQuery(); });

    initCascade();
    renderRows();
  </script>
</body>
</html>
